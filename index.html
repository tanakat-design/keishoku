<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>軽食 在庫管理</title>
<base target="_top">
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--text:#1f2329;--sub:#6b7280;--accent:#1a73e8;--accent-weak:#e8f0fe;--danger:#d93025;--danger-weak:#fce8e6;--ok-weak:#e6f4ea;--warn-weak:#fef7e0;--muted:#eceff3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:20px;margin:8px 0 16px}
h2{font-size:16px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
label.check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:15px;margin-top:16px}
label.check input{width:20px;height:20px}
input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-family:inherit}
button{font-size:16px;border:none;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:600;font-family:inherit}
.btn{background:var(--accent);color:#fff;width:100%}
.btn-danger{background:var(--danger)}
.btn:disabled{background:#c4c9d0}
.btn-sub{background:var(--muted);color:var(--text)}
.link{background:none;color:var(--accent);padding:8px 0;font-weight:500}
.small{font-size:13px;color:var(--sub)}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:20px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;background:var(--muted);border-radius:10px;padding:4px;margin:12px 0}
.tab{flex:1;background:none;color:var(--sub);padding:10px}
.tab.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;color:var(--text);font-size:16px}
.item .meta{font-size:12px;color:var(--sub);font-weight:500;margin-top:6px}
.item.sel{border-color:var(--danger);background:var(--danger-weak)}
.item.sel .meta{color:var(--danger)}
.item.out{background:var(--muted);color:var(--sub);border-color:var(--muted)}
.item.pending{border-style:dashed;border-color:#c4c9d0}
.item .cancel{margin-top:8px;font-size:13px;padding:6px 8px;background:#fff;color:var(--danger);border:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;font-weight:600}
.row .nm .small{font-weight:400;margin-top:2px}
.row input{width:96px;text-align:right}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;line-height:1.5}
.notice.info{background:var(--accent-weak)}
.notice.warn{background:var(--warn-weak)}
.notice.ok{background:var(--ok-weak)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#1f2329;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:90%}
#toast.show{opacity:1}
.hidden{display:none!important}
.irow{display:flex;gap:8px;margin-top:8px}
.irow .iname{flex:1;min-width:0}
.irow .istock{width:84px}
.irow button{padding:8px 12px;flex:0 0 auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns button{flex:1}
.empty{color:var(--sub);text-align:center;padding:24px 0}
textarea{margin-top:10px;font-size:14px;resize:vertical}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar hidden" id="bar"><div class="in" id="barIn"></div></div>
<div id="toast"></div>
<script>
/* ===== 共通 ===== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const S = { view: 'loading', error: '', tournaments: [], today: '', session: null, date: null, tab: 'record',
  day: null, loading: false, loadedAt: null, sel: new Set(), draft: {}, busy: false, admin: null, form: null };
const app = document.getElementById('app');
const bar = document.getElementById('bar');
const barIn = document.getElementById('barIn');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }
// Apps Script の公開URL（外部に置いた画面からはここへ送信する）
const API_URL = 'https://script.google.com/macros/s/AKfycbzCLMde4qTOdRf06XvaUvqnHq3iKx6n3T_NXuQj_73kWVgeTVVCr8uoy8agzA7cvcSlNw/exec';
async function call(fn, ...args) {
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => { google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args); });
  }
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
  if (!r.ok) throw new Error('サーバーエラー（' + r.status + '）');
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.result;
}
function errMsg(e) { return e && e.message ? e.message : String(e); }
function isNetErr(e) { return !navigator.onLine || /network|failed to fetch|ネットワーク|接続/i.test(errMsg(e)); }
function netMsg(e) { return isNetErr(e) ? '通信できません。電波を確認してください' : errMsg(e); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function md(ds) { if (!ds) return ''; const [y, m, d] = ds.split('-').map(Number); return m + '/' + d + '(' + '日月火水木金土'[new Date(y, m - 1, d).getDay()] + ')'; }
function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function addDays(ds, n) { const [y, m, d] = ds.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function dayKey(tid, date) { return 'kDay:' + tid + ':' + date; }

/* ===== 未送信キュー（電波が弱いときは端末に保存して自動再送） ===== */
function queue() { return LS.get('kQueue', []); }
function setQueue(q) { LS.set('kQueue', q); }
function enqueue(job) { const q = queue(); q.push(job); setQueue(q); }
function pendingOut() {
  const set = new Set(); const s = S.session; if (!s) return set;
  queue().forEach(j => { if (j.kind === 'out' && j.tid === s.tid && j.date === S.date) j.names.forEach(n => set.add(n)); });
  return set;
}
function pendingClose() { const s = S.session; return !!s && queue().some(j => j.kind === 'close' && j.tid === s.tid && j.date === S.date); }
async function flush() {
  if (flush.running || !queue().length) return;
  flush.running = true;
  let changed = false;
  try {
    let q = queue();
    while (q.length) {
      try { await call(q[0].fn, ...q[0].args); }
      catch (e) { if (isNetErr(e)) break; toast('未送信データを送信できませんでした：' + errMsg(e)); }
      q = queue(); q.shift(); setQueue(q); changed = true;
    }
  } finally { flush.running = false; }
  if (changed) {
    if (!queue().length) toast('未送信データを送信しました');
    if (S.view === 'main') loadDay(true);
  }
}
window.addEventListener('online', flush);
setInterval(flush, 20000);

/* ===== 起動 ===== */
async function init() {
  S.view = 'loading'; render();
  const saved = LS.get('kSession', null);
  try { const r = await call('getTournaments'); S.tournaments = r.list; S.today = r.today; }
  catch (e) {
    if (saved && isNetErr(e) && LS.get('kSessInfo', null)) return enterOffline(saved);
    S.view = 'error'; S.error = netMsg(e); return render();
  }
  if (saved) {
    try { await login(saved.tid, saved.pin, saved.staff); flush(); return; }
    catch (e) { if (isNetErr(e) && LS.get('kSessInfo', null)) return enterOffline(saved); LS.del('kSession'); }
  }
  S.view = 'login'; render();
}
function enterOffline(saved) {
  const info = LS.get('kSessInfo');
  S.session = { tid: saved.tid, pin: saved.pin, staff: saved.staff, name: info.name, days: info.days };
  S.date = info.date || info.days[0] || null;
  S.day = S.date ? LS.get(dayKey(saved.tid, S.date), null) : null;
  S.view = 'main'; render();
  toast('オフラインです。保存済みのデータで表示しています');
}
async function login(tid, pin, staff) {
  const r = await call('staffLogin', tid, pin);
  S.session = { tid, pin, staff, name: r.name, days: r.days };
  S.today = r.today;
  S.date = r.days.includes(r.today) ? r.today : (r.days.find(d => d >= r.today) || r.days[r.days.length - 1] || null);
  S.tab = 'record'; S.sel = new Set(); S.draft = {};
  S.day = S.date ? LS.get(dayKey(tid, S.date), null) : null;
  LS.set('kSession', { tid, pin, staff }); LS.set('kStaffName', staff);
  LS.set('kSessInfo', { name: r.name, days: r.days, date: S.date });
  S.view = 'main';
  await loadDay();
}
async function loadDay(quiet) {
  const s = S.session;
  if (!S.date) { S.day = null; return render(); }
  const date = S.date;
  S.loading = true;
  if (!quiet) render();
  try {
    const r = await call('getDayState', s.tid, s.pin, date);
    if (date !== S.date) return; // 読み込み中に日付が切り替わった
    S.day = r; S.loadedAt = new Date(); LS.set(dayKey(s.tid, date), r);
  } catch (e) {
    if (!quiet) toast(netMsg(e));
  } finally { S.loading = false; }
  if (S.day) S.day.items.forEach(it => { if (it.soldOut) S.sel.delete(it.name); });
  render();
}

/* ===== 描画 ===== */
function render() {
  if (S.view === 'loading') { hideBar(); app.innerHTML = '<div class="empty">読み込み中…</div>'; return; }
  if (S.view === 'error') { hideBar(); app.innerHTML = `<h1>軽食 在庫管理</h1><div class="card"><div class="notice warn">${esc(S.error)}</div><button class="btn" onclick="init()">再読み込み</button></div>`; return; }
  ({ login: renderLogin, main: renderMain, adminLogin: renderAdminLogin, adminList: renderAdminList, adminEdit: renderAdminEdit })[S.view]();
}
function hideBar() { bar.classList.add('hidden'); }
function showBar(html) { barIn.innerHTML = html; bar.classList.remove('hidden'); }

/* --- ログイン --- */
function renderLogin() {
  hideBar();
  const opts = S.tournaments.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  app.innerHTML = `<h1>軽食 在庫管理</h1><div class="card">
    ${S.tournaments.length ? '' : '<div class="notice warn">有効な大会がありません。管理者メニューから大会を登録してください。</div>'}
    <label>大会</label><select id="lgT">${opts}</select>
    <label>スタッフPIN</label><input id="lgP" type="password" inputmode="numeric" autocomplete="off">
    <label>名前</label><input id="lgN" value="${esc(LS.get('kStaffName', ''))}" placeholder="例：佐藤">
    <button class="btn" style="margin-top:16px" onclick="doLogin()" ${S.tournaments.length ? '' : 'disabled'}>開始</button></div>
    <div style="text-align:center"><button class="link" onclick="openAdmin()">管理者メニュー</button></div>`;
}
async function doLogin() {
  const tid = val('lgT'), pin = val('lgP').trim(), staff = val('lgN').trim();
  if (!pin) return toast('PINを入力してください');
  if (!staff) return toast('名前を入力してください');
  try { await login(tid, pin, staff); } catch (e) { toast(netMsg(e)); }
}
function logout() {
  const q = queue().length;
  if (!confirm(q ? `未送信のデータが${q}件あります。切り替えても自動送信は続きます。切り替えますか？` : '大会・入力者を切り替えますか？')) return;
  LS.del('kSession'); LS.del('kSessInfo');
  S.session = null; S.day = null;
  backToLogin();
}

/* --- メイン --- */
function renderMain() {
  const s = S.session;
  let h = `<div class="header"><div><h1 style="margin-bottom:4px">${esc(s.name)}</h1><div class="small">入力者：${esc(s.staff)}</div></div><button class="link" onclick="logout()">切替</button></div>`;
  if (!s.days.length) { hideBar(); app.innerHTML = h + '<div class="card empty">開催日が設定されていません。管理者に連絡してください。</div>'; return; }
  h += '<div class="chips">' + s.days.map(d => `<button class="chip ${d === S.date ? 'on' : ''}" onclick="pickDate('${d}')">${md(d)}</button>`).join('') + '</div>';
  h += `<div class="tabs"><button class="tab ${S.tab === 'record' ? 'on' : ''}" onclick="pickTab('record')">在庫切れ記録</button><button class="tab ${S.tab === 'close' ? 'on' : ''}" onclick="pickTab('close')">期限切れ</button></div>`;
  const q = queue().filter(j => j.tid === s.tid).length;
  if (q) h += `<div class="notice warn">未送信が${q}件あります。通信が回復すると自動で送信します。</div>`;
  if (!S.day) {
    h += S.loading ? '<div class="card empty">読み込み中…</div>' : '<div class="card empty">データを取得できません。電波を確認して「更新」を押してください。<br><button class="link" onclick="loadDay()">更新</button></div>';
    hideBar(); app.innerHTML = h; return;
  }
  h += S.tab === 'record' ? recordHtml() : closeHtml();
  h += `<div class="small" style="text-align:center;margin-top:12px">${S.loadedAt ? '最終更新 ' + hhmm(S.loadedAt) : 'オフライン表示'}　<button class="link" onclick="loadDay()">更新</button></div>`;
  app.innerHTML = h;
  const has = S.day.items.length;
  if (S.tab === 'record' && has) {
    const n = S.sel.size;
    showBar(`<button class="btn btn-danger" ${n && !S.busy ? '' : 'disabled'} onclick="submitOut()">${n ? `在庫切れを記録（${n}件）` : '在庫切れの品目を選んでください'}</button>`);
  } else if (S.tab === 'close' && has) {
    showBar(`<button class="btn" ${S.busy ? 'disabled' : ''} onclick="submitClose()">期限切れ数を送信</button>`);
  } else hideBar();
}
function pickDate(d) {
  if (d === S.date) return;
  S.date = d; S.sel.clear();
  S.day = LS.get(dayKey(S.session.tid, d), null); S.loadedAt = null;
  const info = LS.get('kSessInfo', null); if (info) { info.date = d; LS.set('kSessInfo', info); }
  loadDay();
}
function pickTab(t) { S.tab = t; render(); loadDay(true); }

/* --- 時間帯（品目名末尾の「（10:30）」）ごとのグループ表示 --- */
function slotOf(name) { const m = String(name).match(/（(\d{1,2}:\d{2})）$/); return m ? m[1] : ''; }
function baseName(name) { return String(name).replace(/（\d{1,2}:\d{2}）$/, ''); }
function toMin(t) { const [h, m] = (t || '99:99').split(':').map(Number); return h * 60 + m; }
function groupBySlot(items) {
  const g = [];
  items.forEach((it, i) => { const s = slotOf(it.name); let x = g.find(y => y.slot === s); if (!x) g.push(x = { slot: s, list: [] }); x.list.push([it, i]); });
  return g.sort((a, b) => toMin(a.slot) - toMin(b.slot));
}
function slotHead(slot) { return slot ? '<h2>' + esc(slot) + ' 受取分</h2>' : ''; }

/* --- 在庫切れ記録 --- */
function recordHtml() {
  const items = S.day.items;
  if (!items.length) return '<div class="card empty">この日の軽食が設定されていません</div>';
  const pend = pendingOut();
  return groupBySlot(items).map(g => slotHead(g.slot) + '<div class="grid">' + g.list.map(([it, i]) => {
    const nm = esc(g.slot ? baseName(it.name) : it.name);
    if (it.soldOut) return `<div class="item out"><div>${nm}</div><div class="meta">在庫切れ ${esc(it.soldOut.time)}（${esc(it.soldOut.by)}）</div><button class="cancel" onclick="cancelOut(${i})">取消</button></div>`;
    if (pend.has(it.name)) return `<div class="item out pending"><div>${nm}</div><div class="meta">在庫切れ（送信待ち）</div></div>`;
    const on = S.sel.has(it.name);
    return `<button class="item ${on ? 'sel' : ''}" onclick="toggle(${i})"><div>${nm}</div><div class="meta">${on ? '✓ 選択中' : '在庫数 ' + it.stock}</div></button>`;
  }).join('') + '</div>').join('');
}
function toggle(i) { const n = S.day.items[i].name; S.sel.has(n) ? S.sel.delete(n) : S.sel.add(n); render(); }
async function submitOut() {
  const names = [...S.sel]; if (!names.length || S.busy) return;
  if (!confirm('以下を在庫切れとして記録します。\n\n' + names.map(n => '・' + n).join('\n'))) return;
  const s = S.session;
  const args = [s.tid, s.pin, S.date, names, s.staff, uid(), Date.now()];
  S.busy = true; render();
  try {
    S.day = await call('markSoldOut', ...args); S.loadedAt = new Date(); LS.set(dayKey(s.tid, S.date), S.day);
    toast('記録しました');
  } catch (e) {
    if (isNetErr(e)) { enqueue({ fn: 'markSoldOut', args, kind: 'out', tid: s.tid, date: S.date, names }); toast('通信できないため端末に保存しました。回復後に自動送信します'); }
    else toast(errMsg(e));
  }
  S.sel.clear(); S.busy = false; render();
}
async function cancelOut(i) {
  const it = S.day.items[i];
  if (!confirm(`「${it.name}」の在庫切れ記録を取り消しますか？`)) return;
  const s = S.session;
  S.busy = true;
  try { S.day = await call('cancelSoldOut', s.tid, s.pin, S.date, it.name, s.staff); S.loadedAt = new Date(); toast('取り消しました'); }
  catch (e) { toast(isNetErr(e) ? '通信できないため取り消せません' : errMsg(e)); }
  S.busy = false; render();
}

/* --- 期限切れ --- */
function closeValue(it) {
  const d = S.draft[S.date] || {};
  if (d[it.name] !== undefined) return d[it.name];
  if (it.remain != null) return it.remain;
  return it.soldOut ? 0 : '';
}
function closeHtml() {
  const d = S.day;
  if (!d.items.length) return '<div class="card empty">この日の軽食が設定されていません</div>';
  let h = '';
  const pend = pendingOut();
  if (pendingClose()) h += '<div class="notice warn">期限切れ数のデータが送信待ちです。</div>';
  else if (d.closed) h += `<div class="notice ok">送信済み ${esc(d.closed.at)}（${esc(d.closed.by)}）。再送信すると上書きされます。</div>`;
  else h += '<div class="notice info">賞味期限切れ時に、期限切れとなる各品目の数を数えて入力してください。在庫切れになった品目は表示されません（期限切れ0として自動で記録されます）。</div>';
  const groups = groupBySlot(d.items).map(g => ({ slot: g.slot, list: g.list.filter(([it]) => !it.soldOut && !pend.has(it.name)) })).filter(g => g.list.length);
  if (!groups.length) h += '<div class="card empty">すべての品目が在庫切れのため、入力は不要です。「期限切れ数を送信」を押してください。</div>';
  h += groups.map(g => slotHead(g.slot) + '<div class="card" style="padding:4px 16px">' + g.list.map(([it, i]) =>
    `<div class="row"><div class="nm">${esc(g.slot ? baseName(it.name) : it.name)}<div class="small">在庫数 ${it.stock}</div></div>
     <input type="number" inputmode="numeric" min="0" step="1" placeholder="個数" value="${esc(closeValue(it))}" data-i="${i}" oninput="draftIn(this)"></div>`).join('') + '</div>').join('');
  return h;
}
function draftIn(el) { const it = S.day.items[+el.dataset.i]; (S.draft[S.date] = S.draft[S.date] || {})[it.name] = el.value; }
async function submitClose() {
  if (S.busy) return;
  const entries = [], over = [];
  const pend = pendingOut();
  for (const it of S.day.items) {
    if (it.soldOut || pend.has(it.name)) { entries.push({ item: it.name, remain: 0 }); continue; } // 在庫切れは期限切れ0
    const v = String(closeValue(it)).trim();
    if (!/^\d+$/.test(v)) return toast(`「${it.name}」の期限切れ数を入力してください`);
    if (+v > it.stock) over.push(it.name);
    entries.push({ item: it.name, remain: +v });
  }
  let msg = `${md(S.date)} の期限切れ数を送信します。`;
  if (over.length) msg += '\n\n在庫数より多い期限切れ数があります：\n' + over.map(n => '・' + n).join('\n');
  if (S.day.closed) msg += '\n\n送信済みのデータは上書きされます。';
  if (!confirm(msg)) return;
  const s = S.session, date = S.date;
  const args = [s.tid, s.pin, date, entries, s.staff, Date.now()];
  S.busy = true; render();
  try {
    S.day = await call('submitClose', ...args); S.loadedAt = new Date(); LS.set(dayKey(s.tid, date), S.day);
    delete S.draft[date]; toast('送信しました');
  } catch (e) {
    if (isNetErr(e)) {
      setQueue(queue().filter(j => !(j.kind === 'close' && j.tid === s.tid && j.date === date)));
      enqueue({ fn: 'submitClose', args, kind: 'close', tid: s.tid, date });
      toast('通信できないため端末に保存しました。回復後に自動送信します');
    } else toast(errMsg(e));
  }
  S.busy = false; render();
}

function editT(i) {

}
function copyT(i) { const f = clone(S.admin.list[i]); f.id = ''; f.name += '（コピー）'; S.form = f; S.view = 'adminEdit'; render(); }
function cancelEdit() { if (!confirm('編集内容を破棄しますか？')) return; S.form = null; S.view = 'adminList'; render(); }
function renderAdminEdit() {
  const f = S.form;
  app.innerHTML = `<div class="header"><h1>${f.id ? '大会を編集' : '新しい大会'}</h1><button class="link" onclick="cancelEdit()">キャンセル</button></div>
    <div class="card"><label>大会名</label><input id="fName" value="${esc(f.name)}" placeholder="例：JOPT 2026 Fukuoka #01">
    <label>スタッフPIN（数字4〜8桁）</label><input id="fPin" inputmode="numeric" value="${esc(f.staffPin)}">
    <label class="check"><input type="checkbox" id="fActive" ${f.active ? 'checked' : ''}>有効（スタッフのログイン画面に表示する）</label></div>
    <div class="card"><div style="font-weight:700">軽食シートから取り込み</div>
    <div class="small" style="margin-top:4px">「軽食」シートのCSVファイルを選ぶと、全開催日の軽食リストを一括作成します。シートをコピーして下の欄に貼り付けても取り込めます。</div>

    <label class="btn" style="display:block;text-align:center;margin-top:10px;padding:12px;border-radius:10px;cursor:pointer;color:#fff;font-size:16px;font-weight:600">CSVファイルを選んで取り込む<input type="file" accept=".csv,text/csv,.tsv,.txt" style="display:none" onchange="importFile(this)"></label>
    <textarea id="fImport" rows="3" placeholder="またはここに貼り付け"></textarea>

    f.days.map((d, di) => `<div class="card" data-di="${di}">
      <div class="irow" style="margin-top:0"><input type="date" class="dDate" value="${esc(d.date)}" style="flex:1;min-width:0"><button class="btn-sub" onclick="fAct('delDay',${di})">日を削除</button></div>
      <div class="small" style="margin-top:12px">品目名 ／ 在庫数</div>` +
      d.items.map((it, ii) => `<div class="irow"><input class="iname" value="${esc(it.name)}" placeholder="品目名"><input class="istock" type="number" inputmode="numeric" min="0" step="1" value="${esc(it.stock)}" placeholder="在庫数"><button class="btn-sub" onclick="fAct('delItem',${di},${ii})">×</button></div>`).join('') +
      `<div class="btns"><button class="btn-sub" onclick="fAct('addItem',${di})">＋ 品目を追加</button>${di > 0 ? `<button class="btn-sub" onclick="fAct('copyPrev',${di})">前日の品目をコピー</button>` : ''}</div></div>`).join('') +
    '<button class="btn-sub" style="width:100%" onclick="fAct(\'addDay\')">＋ 開催日を追加</button>';
  showBar(`<button class="btn" ${S.busy ? 'disabled' : ''} onclick="saveT()">保存</button>`);

function readForm() {
  const f = S.form;
  f.name = val('fName'); f.staffPin = val('fPin'); f.active = document.getElementById('fActive').checked;
  f.days = [...document.querySelectorAll('[data-di]')].map(el => ({

      .map(r => ({ name: r.querySelector('.iname').value, stock: r.querySelector('.istock').value })),
  }));
}
function fAct(a, di, ii) {
  readForm();
  const days = S.form.days;
  if (a === 'addItem') days[di].items.push({ name: '', stock: '' });
  if (a === 'delItem') { days[di].items.splice(ii, 1); if (!days[di].items.length) days[di].items.push({ name: '', stock: '' }); }
  if (a === 'copyPrev') days[di].items = clone(days[di - 1].items);
  if (a === 'delDay') { if (days.length === 1) return toast('開催日は1日以上必要です'); if (!confirm('この開催日を削除しますか？')) return; days.splice(di, 1); }
  if (a === 'addDay') { const last = days[days.length - 1]; days.push({ date: last && last.date ? addDays(last.date, 1) : (S.today || ''), items: last ? clone(last.items) : [{ name: '', stock: '' }] }); }
  render();
}
async function saveT() {
  if (S.busy) return;
  readForm(); S.busy = true; render();
  try { S.admin.list = await call('adminSave', S.admin.pin, S.form); S.form = null; S.view = 'adminList'; toast('保存しました'); }
  catch (e) { toast(netMsg(e)); }
  S.busy = false; render();
}

/* ===== 軽食シート（CSV／コピー貼り付け）の取り込み ===== */
function parseTable(text) {
  const first = text.split(/\r?\n/)[0] || '';
  const delim = first.split('\t').length > first.split(',').length ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => String(c).trim()));
}
function mdToIso(md, today) {
  const [m, d] = md.split('/').map(Number);
  const base = today ? new Date(today + 'T00:00:00') : new Date();
  let y = base.getFullYear();
  if (new Date(y, m - 1, d) - base < -120 * 864e5) y++;
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
function importKeishoku(text, today, split) {
  const rows = parseTable(text);
  const isMd = s => /^\d{1,2}\/\d{1,2}$/.test(s || '');
  const hi = rows.findIndex(r => r.some(isMd));
  if (hi < 0) throw new Error('日付の行（例：10/29）が見つかりません');
  const hdr = rows[hi], times = rows[hi + 1] || [];
  const width = Math.max(...rows.map(r => r.length));
  const slots = []; let cur = null;
  for (let c = 0; c < width; c++) {
    if (isMd(hdr[c])) cur = hdr[c];
    if (cur && (isMd(hdr[c]) || /^\d{1,2}:\d{2}$/.test(times[c] || ''))) slots.push({ col: c, date: mdToIso(cur, today), time: times[c] || '' });
  }
  const shortStore = s => s.replace(/[（(][^）)]*[）)]/g, '').trim() || s;
  const inParen = s => { const m = s.match(/[（(]([^）)]*)[）)]/); return m && !/新規/.test(m[1]) ? m[1] : shortStore(s); };
  const days = {}; let store = null;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    if (/^(TRUE|FALSE)$/i.test(r[0] || '') && r[1]) store = r[1];
    if (!store) continue;
    slots.forEach(s => {
      const name = r[s.col] || '', qty = String(r[s.col + 1] || '').replace(/,/g, '');
      if (!name || name === '計' || /^total$/i.test(name) || !/^\d+$/.test(qty) || +qty <= 0) return;
      const key = store + '\u0000' + name + (split ? '\u0000' + s.time : '');
      const day = days[s.date] = days[s.date] || new Map();
      const e = day.get(key) || { store, name, time: split ? s.time : '', stock: 0 };
      e.stock += +qty; day.set(key, e);
    });
    if (r.some(c => /^total$/i.test(c))) store = null;
  }
  const dates = Object.keys(days).sort();
  if (!dates.length) throw new Error('品目と個数を読み取れませんでした');
  return dates.map(date => {
    const list = [...days[date].values()].sort((a, b) => toMin(a.time) - toMin(b.time));
    const count = {}; list.forEach(e => { count[e.name + e.time] = (count[e.name + e.time] || 0) + 1; });
    return { date, items: list.map(e => ({
      name: (e.name.length <= 2 ? inParen(e.store) + ' ' + e.name : (count[e.name + e.time] > 1 ? e.name + '（' + shortStore(e.store) + '）' : e.name)) + (e.time ? '（' + e.time + '）' : ''),
      stock: e.stock,
    })) };
  });
}
async function importFile(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const buf = await f.arrayBuffer();
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { text = new TextDecoder('shift_jis').decode(buf); } // Excelで保存したCSV
  document.getElementById('fImport').value = text.replace(/^\uFEFF/, '');
  importSheet();
}
function importSheet() {
  readForm();
  const text = val('fImport');
  if (!text.trim()) return toast('軽食シートの内容を貼り付けてください');
  let days;
  try { days = importKeishoku(text, S.today, document.getElementById('fSplit').checked); } catch (e) { return toast(errMsg(e)); }
  const n = days.reduce((a, d) => a + d.items.length, 0);
  if (!confirm(`${days.length}日分・${n}品目を読み取りました。\n` + days.map(d => md(d.date) + ' ' + d.items.length + '品目').join('\n') + '\n\n現在の開催日と軽食の設定を置き換えますか？')) return;
  S.form.days = days;
  render();
  toast('取り込みました。内容を確認して保存してください');
}
