<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>軽食メニュー</title>
<!-- Google Fonts は head で読まない（描画が止まるため）。必要なブランドのときだけ loadFont() が後から読む -->
<style>
:root{--u:1vh;--w:1vw;--bg:#f7f7f5;--card:#fff;--text:#1f2329;--sub:#6b7280;--line:#e5e7eb;--accent:#1a73e8;--ok:#1e7d3a;--soon:#b06000;
  /* 品目名に使うサンセリフ。実在するゴシック体を名指しする。総称の sans-serif だけに頼ると、端末の既定が明朝のときに明朝で出てしまう */
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo","BIZ UDPGothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#app{width:calc(var(--w)*100);height:calc(var(--u)*100);display:flex;flex-direction:column;position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#app.rot-r{transform:translateX(100vw) rotate(90deg)}
#app.rot-l{transform:translateY(100vh) rotate(-90deg)}
header{display:flex;align-items:baseline;justify-content:space-between;padding:calc(var(--u)*1.6) calc(var(--w)*2.4) calc(var(--u)*1.2);border-bottom:1px solid var(--line);background:#fff}
header h1{margin:0;font-size:calc(var(--u)*4.2);letter-spacing:.04em}
header h1 small{font-size:calc(var(--u)*2.2);color:var(--sub);font-weight:500;margin-left:calc(var(--w)*1.2);letter-spacing:0}
header .clock{font-size:calc(var(--u)*3);color:var(--sub);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;position:relative;padding:calc(var(--u)*1.6) calc(var(--w)*2);overflow:hidden}
.grid{display:grid;gap:var(--gap);height:100%;align-content:center;justify-content:center;grid-template-columns:repeat(var(--cols),var(--tw))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--tw)*.05);overflow:hidden;display:flex;flex-direction:column;height:var(--th);position:relative}
.ph{position:relative;flex:1;min-height:0;background:#eef0f2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{font-size:calc(var(--tw)*.22);font-weight:700;color:#c3c8cf}
.cap{padding:calc(var(--tw)*.035) calc(var(--tw)*.05) calc(var(--tw)*.04)}
.nm{font-family:var(--sans);font-weight:700;font-size:calc(var(--tw)*.085);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:calc(var(--tw)*.02);gap:6px;flex-wrap:wrap}
.pr{font-size:calc(var(--tw)*.07);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.st{font-size:calc(var(--tw)*.055);font-weight:700;border-radius:999px;padding:.15em .7em;white-space:nowrap}
.st.on{background:#e6f4ea;color:var(--ok)}
.st.soon{background:#fef3e2;color:var(--soon)}
.tile.sold .ph img,.tile.sold .ph .ini,.tile.sold .cap{filter:grayscale(1);opacity:.5}
.tile.sold .ph{background:#f1f1f1}
.band{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:rgba(32,33,36,.85);color:#fff;text-align:center;font-weight:800;letter-spacing:.12em;font-size:calc(var(--tw)*.12);padding:.18em 0;z-index:2}
.tile.soon .ph{opacity:.75}
.scroller{display:flex;flex-direction:column;will-change:transform}
.scroller .grid{height:auto;align-content:start}
@keyframes popscroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,var(--dist),0)}}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*4);color:var(--sub);text-align:center;line-height:1.6}
.ctl{position:fixed;right:calc(var(--w)*1.2);bottom:calc(var(--u)*1.2);display:flex;gap:8px;opacity:0;transition:opacity .3s}
body:hover .ctl,.ctl:focus-within{opacity:1}
.ctl button,.ctl select,.ctl label{font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);cursor:pointer}
.ctl label input{display:none}
.offline{position:fixed;left:calc(var(--w)*1.2);bottom:calc(var(--u)*1.2);font-size:13px;color:#b3261e;background:#fdecea;border-radius:6px;padding:4px 10px;display:none}
.pick{max-width:560px;margin:calc(var(--u)*10) auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
.pick h2{margin:0 0 16px;font-size:22px}
.pick button{display:block;width:100%;text-align:left;font-size:18px;padding:14px 16px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.pick button:hover{border-color:var(--accent)}
header .logo{display:none}
/* ---- SPADIE（ロゴ画像と背景柄は assets/ の元画像の切り出し。加工しない） ---- */
body.b-spadie{background-color:#113465}
.b-spadie #app{--navy:#113465;--card:#0b2650;--yel:#f6c10a;--blu:#2d99d6;--pink:#e4007f;--text:#fff;--sub:#c9d6ea;--line:#2d99d6;
  background-color:#113465;background-repeat:repeat}
.b-spadie header{background:transparent;border-bottom:0;align-items:center;padding:calc(var(--u)*1.2) calc(var(--w)*2.4) .calc(var(--u)*4)}
.b-spadie header h1{display:flex;align-items:center;gap:calc(var(--w)*2);color:#fff}
.b-spadie header .logo{display:block;height:calc(var(--u)*19);width:auto}
.b-spadie header h1 .ttl{display:flex;flex-direction:column;gap:.calc(var(--u)*6)}
.b-spadie header h1 .t{font-family:"DotGothic16",sans-serif;font-weight:400;color:var(--yel);font-size:calc(var(--u)*6);letter-spacing:.08em;line-height:1.1}
.b-spadie header h1 small{color:#fff;margin:0;font-family:"DotGothic16",sans-serif;font-size:calc(var(--u)*2.6)}
.b-spadie header .clock{color:#fff;font-family:"DotGothic16",sans-serif;font-size:calc(var(--u)*5)}
.b-spadie main{padding-top:.calc(var(--u)*6)}
.b-spadie .tile{background:var(--card);border:.calc(var(--u)*3) solid var(--blu);border-radius:.calc(var(--u)*8)}
.b-spadie .ph{background:#1b3d70}
.b-spadie .ph .ini{color:#5f7fae;font-family:"DotGothic16",sans-serif}
.b-spadie .nm{color:#fff}
.b-spadie .pr{font-family:"DotGothic16",sans-serif;font-weight:400;color:var(--yel);font-size:calc(var(--tw)*.08)}
.b-spadie .st{font-family:"DotGothic16",sans-serif;font-weight:400;border-radius:.calc(var(--u)*4)}
.b-spadie .st.on{background:var(--yel);color:var(--navy)}
.b-spadie .st.soon{background:var(--blu);color:#fff}
.b-spadie .band{background:var(--navy);color:var(--yel);font-family:"DotGothic16",sans-serif;font-weight:400;letter-spacing:.16em;border-top:.calc(var(--u)*4) solid var(--pink);border-bottom:.calc(var(--u)*4) solid var(--pink)}
.b-spadie .tile.sold{border-color:#4a5f82}
.b-spadie .tile.sold .ph{background:#1b2c45}
.b-spadie .ctl button{color:#113465;border-color:#fff}
.b-spadie .empty{font-family:"DotGothic16",sans-serif;color:#fff}
/* ---- JOPT（白 / #c86b30）。ロゴは支給画像の切り出しのみ。フォントはすべて こぶりなゴシック Std（表示する端末にインストールされたものを使う。無い端末は Noto Sans JP） ---- */
@font-face{font-family:"JOPT Koburina";font-weight:300;src:local("KoburinaGoStd-W1"),local("Koburina Gothic Std W1"),local("こぶりなゴシック Std W1"),local("KoburinaGoStdN-W1"),local("Koburina Gothic StdN W1"),local("こぶりなゴシック StdN W1")}
@font-face{font-family:"JOPT Koburina";font-weight:400;src:local("KoburinaGoStd-W3"),local("Koburina Gothic Std W3"),local("こぶりなゴシック Std W3"),local("KoburinaGoStdN-W3"),local("Koburina Gothic StdN W3"),local("こぶりなゴシック StdN W3")}
@font-face{font-family:"JOPT Koburina";font-weight:600;src:local("KoburinaGoStd-W6"),local("Koburina Gothic Std W6"),local("こぶりなゴシック Std W6"),local("KoburinaGoStdN-W6"),local("Koburina Gothic StdN W6"),local("こぶりなゴシック StdN W6")}
@font-face{font-family:"JOPT Koburina";font-weight:700;src:local("KoburinaGoStd-W6"),local("Koburina Gothic Std W6"),local("こぶりなゴシック Std W6"),local("KoburinaGoStdN-W6"),local("Koburina Gothic StdN W6"),local("こぶりなゴシック StdN W6")}
@font-face{font-family:"JOPT Koburina";font-weight:900;src:local("KoburinaGoStd-W9"),local("Koburina Gothic Std W9"),local("こぶりなゴシック Std W9"),local("KoburinaGoStdN-W9"),local("Koburina Gothic StdN W9"),local("こぶりなゴシック StdN W9")}
.b-jopt #app{--acc:#c86b30;--text:#2b2b2b;--sub:#7a7a7a;--line:#ece4dc;font-family:"JOPT Koburina","Noto Sans JP",-apple-system,sans-serif;background:#fff}
.b-jopt header{background:transparent;border-bottom:1px solid var(--line);align-items:center;padding:calc(var(--u)*1.6) calc(var(--w)*3) calc(var(--u)*1.4)}
.b-jopt header h1{display:flex;align-items:center;gap:calc(var(--w)*2.2)}
.b-jopt header .logo{display:block;height:calc(var(--u)*15);width:auto}
.b-jopt header h1 .ttl{display:flex;flex-direction:column;gap:calc(var(--u)*.9)}
.b-jopt header h1 .t{font-weight:400;letter-spacing:.32em;font-size:calc(var(--u)*4.4);color:var(--text);line-height:1.1}
.b-jopt header h1 small{margin:0;font-weight:600;letter-spacing:.2em;font-size:calc(var(--u)*1.8);color:var(--acc)}
.b-jopt header .clock{font-weight:400;letter-spacing:.06em;font-size:calc(var(--u)*4);color:var(--text)}
.b-jopt main{padding:calc(var(--u)*2.4) calc(var(--w)*3)}
.b-jopt .tile{background:#fff;border:1px solid var(--line);border-radius:calc(var(--u)*.5);box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.4) rgba(90,45,15,.08)}
.b-jopt .ph{background:#f6f1ec}
.b-jopt .ph .ini{color:#e3cdbd;font-weight:300}
.b-jopt .nm{font-family:"JOPT Koburina",var(--sans);font-weight:400;color:var(--text);letter-spacing:.04em} /* こぶりなゴシック Std もサンセリフ。無い端末では上のゴシックに落とす */
.b-jopt .pr{font-weight:600;color:var(--acc);letter-spacing:.04em}
.b-jopt .st{font-weight:600;border-radius:2px;letter-spacing:.12em}
.b-jopt .st.on{background:var(--acc);color:#fff}
.b-jopt .st.soon{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.b-jopt .band{background:rgba(255,255,255,.92);color:var(--acc);font-weight:600;letter-spacing:.32em;font-size:calc(var(--tw)*.1);border-top:1px solid var(--acc);border-bottom:1px solid var(--acc)}
.b-jopt .tile.sold .ph img{opacity:.45}
.b-jopt .empty{color:var(--sub);letter-spacing:.12em}
.b-jopt-o #app{background:#c86b30;--line:rgba(255,255,255,.4)}
.b-jopt-o header{background:#fff;border-bottom:0;box-shadow:0 calc(var(--u)*.2) calc(var(--u)*1.2) rgba(60,25,5,.15)}
.b-jopt-o .tile{border:0;box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.6) rgba(60,25,5,.18)}
.b-jopt-o .empty{color:#fff}
.o-v.b-jopt header .logo{height:calc(var(--u)*9)}
.o-v.b-jopt header h1 .t{font-size:calc(var(--u)*3)}
.o-v.b-jopt header h1 small{font-size:calc(var(--u)*1.4)}
.o-v.b-jopt header .clock{font-size:calc(var(--u)*2.8)}
/* ---- 縦置き ---- */
.o-v header{flex-wrap:nowrap;gap:calc(var(--w)*2)}
.o-v header h1{min-width:0}
.o-v.b-spadie header .logo{height:calc(var(--u)*10)}
.o-v.b-spadie header h1 .t{font-size:calc(var(--u)*3.3)}
.o-v.b-spadie header h1 small{font-size:calc(var(--u)*1.8)}
.o-v.b-spadie header .clock{font-size:calc(var(--u)*3.4)}
.o-v header h1{font-size:calc(var(--u)*3.4)}
.o-v header h1 small{font-size:calc(var(--u)*1.7)}
.o-v header .clock{font-size:calc(var(--u)*2.4)}
.o-v .empty{font-size:calc(var(--u)*3)}
</style>
</head>
<body>
<div id="app"></div>
<div class="offline" id="off">通信できません（前回の表示のまま）</div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzCLMde4qTOdRf06XvaUvqnHq3iKx6n3T_NXuQj_73kWVgeTVVCr8uoy8agzA7cvcSlNw/exec';
const POLL = 30000;
const TIMEOUT = 25000; // 1回の取得をあきらめるまでの時間。POLL より短くして要求が重ならないようにする
const q = new URLSearchParams(location.search);
const P = { tid: q.get('t') || '', mode: q.get('mode') === 'all' ? 'all' : 'now', date: q.get('date') || '', brand: (q.get('brand') || '').toLowerCase(), orient: ['v', 'v2'].includes(q.get('orient')) ? q.get('orient') : 'h' };
// demo：GASを使わず内蔵の見本データで表示する（デザイン確認用）。値は品目数（既定8、最大40）
P.demo = q.has('demo') ? Math.min(40, Math.max(1, parseInt(q.get('demo'), 10) || 8)) : 0;
// ブランド別デザイン：URLの brand（jopt / spadie）を優先し、なければ大会名に SPADIE を含むかで決める
// SPADIE：assets/LINE_ALBUM_SPADIE ロゴ_260908_2.png（支給されたロゴ画像そのもの）から、表示時にロゴ部分と背景柄の1区画を切り出して使う。画像は加工しない
const JOPT_LOGO = { src: 'assets/' + encodeURIComponent('JOPTロゴ-02.png'), crop: { x: 187, y: 187, w: 687, h: 893 } }; // JOPTロゴ（支給画像）。加工せず切り出すだけ
const BRAND = {
  spadie: { src: 'assets/' + encodeURIComponent('LINE_ALBUM_SPADIE ロゴ_260908_2.png'), crop: { x: 40, y: 285, w: 1120, h: 620 }, tile: { x: 0, y: 0, w: 546, h: 274 } },
  'jopt-w': Object.assign({ cls: 'b-jopt' }, JOPT_LOGO), // JOPT：白背景
  'jopt-o': Object.assign({ cls: 'b-jopt' }, JOPT_LOGO), // JOPT：#c86b30 背景
};
// Webフォントは必要なときだけ、描画のあとに読む。標準デザインは端末のフォントだけで表示するため何も読まない
// SPADIE は DotGothic16 が要る。JOPT は こぶりなゴシック Std が端末に無いときだけ Noto Sans JP を読む
const JOPT_FALLBACK = 'family=Noto+Sans+JP:wght@300;400;600;900';
function loadFont(b, cls) {
  if (b === 'spadie') return addFont('family=DotGothic16');
  if (cls !== 'b-jopt' || S.fontChecked) return;
  // こぶりなゴシック Std があるかは、描画が済んで @font-face の local() が解決するまで分からない。
  // document.fonts.ready を待ってから1回だけ判定する（待たずに調べると必ず「無い」と出て、無駄に読んでしまう）
  S.fontChecked = true;
  let done = false;
  const judge = () => { if (done) return; done = true; if (!hasFont('JOPT Koburina')) addFont(JOPT_FALLBACK); };
  setTimeout(judge, 3000); // ready が解決しない端末でも必ず判定する
  try { document.fonts.ready.then(judge, judge); } catch (e) { judge(); }
}
function addFont(fam) {
  if (S.font === fam) return;
  S.font = fam;
  const l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?' + fam + '&display=swap';
  document.head.appendChild(l);
}
function hasFont(n) { try { return document.fonts.check('16px "' + n + '"'); } catch (e) { return false; } }
function cut(img, r) { const c = document.createElement('canvas'); c.width = r.w; c.height = r.h; c.getContext('2d').drawImage(img, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h); return toBlobUrl(c.toDataURL('image/png')); }
function prepBrand(B) {
  if (!B.src || B.ready || B.loading) return;
  B.loading = true;
  const img = new Image();
  img.onload = () => { B.logo = cut(img, B.crop); if (B.tile) B.bg = cut(img, B.tile); B.ready = true; if (S.data) render(); };
  img.onerror = () => { B.loading = false; };
  img.src = B.src;
}
// ブランド：URLの brand（std / spadie / jopt-w / jopt-o）を優先。なければ大会名で判定（SPADIE → spadie、JOPT かつ Osaka → jopt-w、その他 → 標準）
function brandOf(name) {
  if (BRAND[P.brand] || P.brand === 'std') return P.brand;
  if (/spadie/i.test(name || '')) return 'spadie';
  if (/jopt/i.test(name || '') && /osaka/i.test(name || '')) return 'jopt-w';
  return 'std';
}
const S = { data: null, imgs: {}, imgV: {}, tick: null, gen: 0, photoSeq: 0 }; // gen：大会を切り替えた回数、photoSeq：テスト表示で写真を操作した回数。どちらも古い結果を捨てるために使う
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// sig は打ち切り用。取得ごとに別の AbortController を渡す（共有すると古い取得が新しい取得を巻き込む）
async function call(sig, fn, ...args) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), signal: sig || undefined });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'エラー');
  return j.result;
}
function setParam() {
  const u = new URL(location.href);
  u.searchParams.set('t', P.tid); u.searchParams.set('mode', P.mode);
  if (P.orient === 'h') u.searchParams.delete('orient'); else u.searchParams.set('orient', P.orient);
  history.replaceState(null, '', u);
}

/* --- 大会の選択（URLに t がないとき） --- */
async function pick() {
  const gen = S.gen; // 遅れて届いた一覧が、選択後の大会画面を上書きしないようにする
  app.innerHTML = '<div class="empty">読み込み中…</div>';
  try {
    const r = await call(null, 'getPopState', '');
    if (gen !== S.gen) return;
    app.innerHTML = `<div class="pick"><h2>表示する大会を選んでください</h2>${r.tournaments.length ? r.tournaments.map(t => `<button onclick="choose('${esc(t.id)}')">${esc(t.name)}</button>`).join('') : '<div>表示中の大会がありません。</div>'}</div>`;
  } catch (e) { if (gen === S.gen) app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function choose(id) { P.tid = id; setParam(); start(); }

/* --- 表示 --- */
function addDay(d, n) { const x = new Date(d + 'T00:00:00+09:00'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function recvAt(date, hm) { if (!hm) return ''; const [h] = hm.split(':').map(Number); return (h < 5 ? addDay(date, 1) : date) + ' ' + hm.padStart(5, '0'); }
function nowStr() {
  // サーバー時刻を基準に、取得からの経過分を足す（端末の時計がずれていても表示がずれないように）
  const base = new Date(S.data.now.replace(' ', 'T') + ':00+09:00').getTime() + (Date.now() - S.fetchedAt);
  const d = new Date(base + 9 * 3600000).toISOString();
  return d.slice(0, 10) + ' ' + d.slice(11, 16);
}
function tiles() {
  const d = S.data, now = nowStr(), map = new Map();
  d.items.forEach(it => { if (!map.has(it.base)) map.set(it.base, []); map.get(it.base).push(it); });
  const out = [];
  map.forEach((rs, base) => {
    const cur = rs.filter(r => (!r.recv || recvAt(d.date, r.recv) <= now) && (!r.exp || now < r.exp));
    const fut = rs.filter(r => r.recv && recvAt(d.date, r.recv) > now).map(r => r.recv).sort();
    let st;
    if (cur.some(r => !r.sold)) st = 'on';
    else if (cur.length) st = 'sold';
    else if (fut.length) st = 'soon';
    else st = 'ended';
    if (P.mode === 'now' && (st === 'soon' || st === 'ended')) return;
    out.push({ base, st, from: fut[0] || '', info: d.info[base] || {} });
  });
  return out;
}
// タイルの大きさを画面に合わせる。小さくなりすぎる（約2.4段以上並ぶ）場合は、大きさを保ったまま下へ自動で流し続ける（無限スクロール）
function layout(n) {
  const m = document.querySelector('main'); if (!m || !n) return;
  const cs = getComputedStyle(m);
  const W = m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
  const H = m.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2, ratio = 1.05; // 高さ = 幅 × ratio
  const gap = Math.max(8, Math.min(W, H) * 0.018);
  let best = { tw: 0 };
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const tw = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r / ratio);
    if (tw > best.tw) best = { tw, c };
  }
  const g = document.querySelector('.grid');
  const set = (c, tw) => { g.style.setProperty('--cols', c); g.style.setProperty('--tw', tw + 'px'); g.style.setProperty('--th', tw * ratio + 'px'); g.style.setProperty('--gap', gap + 'px'); };
  const minTw = (Math.min(W, H) - gap * 1.4) / 2.4 / ratio; // これより小さくはしない（短い辺に約2.4枚分）
  m.classList.remove('scrolling');
  if (best.tw >= minTw) { set(best.c, best.tw); S.scroll0 = 0; return; }
  const c = Math.max(1, Math.floor((W + gap) / (minTw + gap)));
  const tw = Math.min((W - gap * (c - 1)) / c, (H * 0.6) / ratio);
  set(c, tw);
  const r = Math.ceil(n / c), dist = r * tw * ratio + r * gap; // 1周分の移動距離（グリッド1つ分＋間隔）
  const wrap = document.createElement('div'); wrap.className = 'scroller'; wrap.style.gap = gap + 'px';
  g.replaceWith(wrap); wrap.append(g, g.cloneNode(true)); // 同じ並びを2つ縦に並べ、1つ分動いたら最初に戻す
  const dur = dist / (H / 14); // 画面の高さを約14秒で流れる速さ
  if (!S.scroll0) S.scroll0 = Date.now();
  wrap.style.setProperty('--dist', -dist + 'px');
  wrap.style.animation = `popscroll ${dur}s linear infinite`;
  wrap.style.animationDelay = -(((Date.now() - S.scroll0) / 1000) % dur) + 's'; // 再描画しても位置が飛ばないように
  m.classList.add('scrolling');
}
// 向き：h＝横、v＝縦、v2＝縦（上下逆）。縦で画面が横長のとき（縦置きのテレビが回転表示できない場合）は90°回転して表示する
function orient() {
  const a = app.style, W = innerWidth, H = innerHeight, rot = P.orient !== 'h' && W > H;
  app.className = rot ? (P.orient === 'v' ? 'rot-r' : 'rot-l') : '';
  const w = rot ? H : W, h = rot ? W : H;
  a.setProperty('--u', h / 100 + 'px'); a.setProperty('--w', w / 100 + 'px');
  a.transform = !rot && P.orient === 'v2' ? 'rotate(180deg)' : ''; a.transformOrigin = !rot && P.orient === 'v2' ? '50% 50%' : '';
  document.body.classList.toggle('o-v', P.orient !== 'h');
}
function render() {
  const d = S.data;
  const list = tiles();
  const hm = nowStr().slice(11);
  const b = brandOf(d.name), B = BRAND[b] || {};
  document.body.className = 'b-' + b + (B.cls ? ' ' + B.cls : '');
  loadFont(b, B.cls);
  orient();
  prepBrand(B);
  const bgi = B.bg ? `url(${B.bg})` : ''; if (S.bgi !== bgi) { app.style.backgroundImage = bgi; S.bgi = bgi; }
  const html = `<header><h1>${B.logo ? `<img class="logo" src="${B.logo}" alt="">` : ''}<span class="ttl"><span class="t">軽食メニュー</span><small>${esc(d.name)}</small></span></h1><div class="clock">${hm}</div></header>
    <main>${list.length ? `<div class="grid">${list.map(t => {
      const img = S.imgs[t.base];
      // 値段はドリンクチケットの枚数で示す（現金販売ではないため）。保存している数値はそのまま、見せ方だけを変えている
      const price = t.info.price !== '' && t.info.price != null ? 'ドリチケ' + Number(t.info.price).toLocaleString('ja-JP') + '枚' : '';
      const badge = t.st === 'on' ? '<span class="st on">販売中</span>' : t.st === 'soon' ? `<span class="st soon">${esc(t.from)}から販売</span>` : '';
      return `<div class="tile ${t.st === 'sold' || t.st === 'ended' ? 'sold' : t.st}">
        <div class="ph">${img ? `<img src="${img}" alt="">` : `<span class="ini">${esc(Array.from(t.base)[0] || '')}</span>`}${t.st === 'sold' || t.st === 'ended' ? '<div class="band">SOLD OUT</div>' : ''}</div>
        <div class="cap"><div class="nm">${esc(t.base)}</div><div class="row"><span class="pr">${price}</span>${badge}</div></div></div>`;
    }).join('')}</div>` : `<div class="empty">${P.mode === 'now' ? '現在販売中の軽食はありません' : '本日の軽食はありません'}</div>`}</main>
    <div class="ctl"><button onclick="toggleMode()">${P.mode === 'now' ? '表示：販売中のみ → 全品目に切替' : '表示：全品目 → 販売中のみに切替'}</button><button onclick="toggleOrient()">向き：${({ h: '横', v: '縦', v2: '縦（上下逆）' })[P.orient]} → 切替</button><button onclick="fs()">全画面</button>${P.demo ? '<label>写真を選ぶ<input type="file" accept="image/*" multiple onchange="demoPick(this)"></label><button onclick="demoClear()">見本の絵に戻す</button>' : '<button onclick="backToPick()">大会を変更</button>'}</div>`;
  // 表示内容が前回と同じなら作り直さず時計だけ更新する（写真を含む画面全体の再構築とスクロールのやり直しを避ける）
  const key = html.replace(/<div class="clock">[^<]*<\/div>/, '') + '|' + innerWidth + 'x' + innerHeight + '|' + P.orient + '|' + !!B.logo;
  if (key === S.lastKey && app.querySelector('main')) { const c = app.querySelector('.clock'); if (c && c.textContent !== hm) c.textContent = hm; return; }
  S.lastKey = key;
  app.innerHTML = html;
  layout(list.length);
  alignBg(B);
}
// 背景柄をロゴ画像内の柄と継ぎ目なくつなげる（ロゴは元画像の (crop.x, crop.y) から切り出しているため、その位置に柄の原点を合わせる）
function alignBg(B) {
  const st = app.style;
  const img = document.querySelector('header .logo');
  if (!B.tile || !img) { st.backgroundSize = st.backgroundPosition = ''; return; }
  const set = () => {
    let x = 0, y = 0, e = img; // #app 内での位置（回転の影響を受けないレイアウト上の座標）
    while (e && e !== app) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
    const k = img.offsetHeight / B.crop.h; if (!k) return;
    st.backgroundSize = (B.tile.w * k) + 'px ' + (B.tile.h * k) + 'px';
    st.backgroundPosition = (x - B.crop.x * k) + 'px ' + (y - B.crop.y * k) + 'px';
  };
  img.complete ? set() : img.addEventListener('load', set, { once: true });
}
function toggleOrient() { P.orient = ({ h: 'v', v: 'v2', v2: 'h' })[P.orient]; setParam(); render(); }
function toggleMode() { P.mode = P.mode === 'now' ? 'all' : 'now'; setParam(); render(); }
function fs() { const e = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : e.requestFullscreen && e.requestFullscreen()); }

// 写真の data URL を Blob URL に変える（長い文字列を画面に埋め込まないため軽い）
function toBlobUrl(d) {
  const m = /^data:([^;]+);base64,(.*)$/.exec(d); if (!m) return d;
  const bin = atob(m[2]), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([a], { type: m[1] }));
}
// 保存庫（IndexedDB 'pop'）。img ストアは写真（キー＝品目名、値＝{v, d}）、state ストアは前回の表示内容。
// 再読み込みのたびに GAS から取り直さないために使う。使えない端末では単に効かないだけにする
const DB = { p: null };
// 保存庫の処理は必ず決着させる。決着しないと load() の S.busy が戻らず、以後の取得が止まるため
function settle(p, ms, fallback) {
  return Promise.race([p, new Promise(res => setTimeout(() => res(fallback), ms))]).catch(() => fallback);
}
function db() {
  if (DB.p) return DB.p;
  DB.p = settle(new Promise(res => {
    let q; try { q = indexedDB.open('pop', 2); } catch (e) { return res(null); }
    q.onupgradeneeded = () => {
      const x = q.result;
      if (!x.objectStoreNames.contains('img')) x.createObjectStore('img');
      if (!x.objectStoreNames.contains('state')) x.createObjectStore('state');
    };
    q.onsuccess = () => res(q.result);
    q.onerror = q.onblocked = () => res(null);
  }), 3000, null);
  return DB.p;
}
function dbAll() {
  return settle(db().then(d => {
    if (!d) return {};
    return new Promise(res => {
      const out = {}, t = d.transaction('img'), c = t.objectStore('img').openCursor();
      t.onabort = t.onerror = () => res(out); // 要求のエラーを伴わない中断でも決着させる
      c.onsuccess = e => { const k = e.target.result; if (!k) return res(out); out[k.key] = k.value; k.continue(); };
      c.onerror = () => res(out);
    });
  }), 3000, {});
}
function dbGet(store, key) {
  return settle(db().then(d => {
    if (!d) return null;
    return new Promise(res => {
      const t = d.transaction(store), r = t.objectStore(store).get(key);
      t.onabort = t.onerror = () => res(null);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
  }), 3000, null);
}
function dbSet(store, key, val) { db().then(x => { if (x) x.transaction(store, 'readwrite').objectStore(store).put(val, key); }).catch(() => { }); }
function dbPut(n, v, d) { dbSet('img', n, { v, d }); }
function dbDel(n) { db().then(x => { if (x) x.transaction('img', 'readwrite').objectStore('img').delete(n); }).catch(() => { }); }

// 営業日（JST の 現在−5時間 の日付）。保存した内容が今日のものかを、通信せずに判定するために使う
function bizDate() { return new Date(Date.now() + 4 * 3600000).toISOString().slice(0, 10); }
// 前回の表示内容を先に出してから通信する。回線が遅い会場でも、開いた瞬間に画面が出るようにする
async function restore(gen) {
  if (S.data) return;
  const s = await dbGet('state', 'last');
  if (gen !== S.gen || S.data) return; // 待っている間に大会が切り替わった／取得が先に届いた
  if (!s || !s.d || s.tid !== P.tid) return;
  if (s.d.date !== (P.date || bizDate())) return; // 日が違えば使わない
  if (Date.now() - s.at > 86400000) return;       // 1日以上前のものは使わない
  Object.keys(s.d.info || {}).forEach(n => { if (s.d.info[n].img) useCached(n, s.d.info[n].v); });
  S.data = s.d; S.fetchedAt = s.at; // 時計は「保存時のサーバー時刻＋経過時間」で正しく進む
  document.getElementById('off').style.display = 'block'; // 「前回の表示のまま」。取得できた時点で消える
  render();
}

async function load() {
  if (S.busy) return; // 前の通信が終わるまで次を出さない（遅いときに要求が積み上がるのを防ぐ）
  if (document.hidden && S.data) return; // 画面が見えていないときは通信しない
  const gen = S.gen; // この取得が始まった時点の大会。途中で切り替わったら結果を捨てる
  S.busy = true;
  const ac = new AbortController(); // この取得専用。共有すると、古い取得のタイマーが新しい取得を打ち切ってしまう
  S.ac = ac;                        // start() から打ち切れるように控えるだけ
  const to = setTimeout(() => ac.abort(), TIMEOUT); // 返ってこない通信は打ち切る
  try {
    // 保存庫を起動時に1回だけ読み、前回の表示を先に出す
    if (!S.cache) {
      const c = await dbAll();
      if (gen !== S.gen) return;
      S.cache = c;
      await restore(gen);
      if (gen !== S.gen) return;
    }
    const d = await call(ac.signal, 'getPopState', P.tid, P.date);
    if (gen !== S.gen) return; // 大会が切り替わった。前の大会の内容を保存・表示しない
    S.data = d; S.fetchedAt = Date.now();
    if (d.info) dbSet('state', 'last', { at: S.fetchedAt, tid: P.tid, d }); // 次に開いたとき即座に出すため保存する（大会一覧は保存しない）
    document.getElementById('off').style.display = 'none';
    // 写真は更新日時が変わったものだけ取り直す。保存庫に同じ版があれば通信しない
    const need = Object.keys(d.info).filter(n => d.info[n].img && S.imgV[n] !== d.info[n].v && !useCached(n, d.info[n].v));
    Object.keys(S.cache).forEach(n => { if (!d.info[n] || !d.info[n].img) { delete S.cache[n]; dbDel(n); } });
    Object.keys(S.imgs).forEach(n => { if (!d.info[n] || !d.info[n].img) { URL.revokeObjectURL(S.imgs[n]); delete S.imgs[n]; delete S.imgV[n]; } });
    if (need.length) {
      const im = await call(ac.signal, 'getPopImages', need);
      if (gen !== S.gen) return;
      need.forEach(n => { if (im[n]) { setImg(n, d.info[n].v, im[n]); S.cache[n] = { v: d.info[n].v, d: im[n] }; dbPut(n, d.info[n].v, im[n]); } });
    }
    render();
  } catch (e) {
    if (gen !== S.gen) return; // 大会の切り替えで打ち切っただけ。新しい取得の表示を壊さない
    const msg = e.name === 'AbortError' ? '通信がとても遅いため中断した' : e.message;
    if (!S.data) app.innerHTML = `<div class="empty">${esc(msg)}<br><small>しばらくすると自動で再読み込みします</small></div>`;
    else document.getElementById('off').style.display = 'block';
  } finally {
    clearTimeout(to);
    if (gen === S.gen) { S.ac = null; S.busy = false; } // 切り替わっていれば reset() が後始末済み。新しい取得を壊さない
  }
}
function setImg(n, v, d) { if (S.imgs[n]) URL.revokeObjectURL(S.imgs[n]); S.imgs[n] = toBlobUrl(d); S.imgV[n] = v; }
// 保存庫に同じ版があればそれを使い、true を返す（＝GASに取りに行かない）
function useCached(n, v) { const c = S.cache[n]; if (!c || c.v !== v) return false; setImg(n, v, c.d); return true; }
// 進行中の取得を終わらせ、表示を白紙に戻す。大会を切り替えるときは必ずここを通す
function reset() {
  clearInterval(S.tick);
  S.gen++;                                  // 進行中の取得の結果を捨てる
  if (S.ac) { S.ac.abort(); S.ac = null; }
  S.busy = false;
  S.data = null; S.lastKey = null;          // 前の大会を残さない
  S.cache = null;                           // 切替先の復元をやり直す
}
function start() {
  reset();
  app.innerHTML = '<div class="empty">読み込み中…</div>';
  load();
  S.tick = setInterval(() => { load(); }, POLL);
}
// 大会選択に戻る。定期取得も止める（止めないと tid 空で取得し続け、大会一覧を表示内容として扱ってしまう）
function backToPick() { reset(); P.tid = ''; pick(); }
setInterval(() => { if (S.data && !document.hidden) render(); }, 20000); // 時計と、受取時刻・賞味期限の到来を反映（内容が変わったときだけ作り直す）
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.data) render(); }, 250); });
document.addEventListener('visibilitychange', () => { if (!P.demo && !document.hidden && S.data) load(); });
/* --- テスト用（?demo=）：GASにも保存庫にも触らず、内蔵の見本データで表示する。本番と同じ描画コードを通すのでデザイン確認に使える --- */
const DEMO_NAMES = ['からあげ弁当', 'おにぎり（鮭）', 'ミックスサンド', '焼きそばパン', 'メロンパン', '豚汁', 'クロワッサン', 'プリン', 'たこ焼き', 'お好み焼き', 'カレーパン', 'ツナマヨおにぎり', 'チョコデニッシュ', 'フルーツサンド', '肉まん', 'コーヒーゼリー', 'ハムサンド', 'あんぱん', 'みたらし団子', 'ポテトサラダ'];
const DEMO_TITLE = { spadie: 'SPADIE Osaka 1st（表示テスト）', 'jopt-w': 'JOPT Osaka #01（表示テスト）', 'jopt-o': 'JOPT Osaka #01（表示テスト）' };
function demoData(n) {
  const date = bizDate();
  const items = [], info = {};
  for (let i = 0; i < n; i++) {
    const base = DEMO_NAMES[i % DEMO_NAMES.length] + (i >= DEMO_NAMES.length ? ' ' + (1 + Math.floor(i / DEMO_NAMES.length)) : '');
    const k = i % 5; // 0,1=販売中 / 2=SOLD OUT / 3=受取前 / 4=期限切れ
    items.push({
      base, store: 'テスト店',
      // 時計は進むので、開いたまま置いても状態が変わらないよう前後を大きく離す（12:00 基準で11時間以上もつ）
      recv: k === 3 ? '23:00' : '07:00',                            // 23:00＝受取前、07:00＝受取済み
      exp: k === 4 ? date + ' 11:00' : addDay(date, 1) + ' 23:59',  // 11:00＝期限切れ、翌日23:59＝期限内
      sold: k === 2
    });
    info[base] = { price: 1 + (i % 3), img: 1, v: 'demo' }; // ドリチケ1〜3枚
  }
  // 時刻は 12:00 固定。実時刻に合わせると、深夜や早朝に開いたとき全品目が「受取前」になって状態を確認できない
  return { name: DEMO_TITLE[P.brand] || '表示テスト大会', date, now: date + ' 12:00', items, info };
}
function demoPhoto(base, i) { // 写真の代わり。色違いの矩形に頭文字を描くだけで、通信も素材も要らない
  const c = document.createElement('canvas'); c.width = 400; c.height = 300;
  const g = c.getContext('2d'), h = (i * 47) % 360;
  g.fillStyle = 'hsl(' + h + ' 45% 82%)'; g.fillRect(0, 0, 400, 300);
  g.fillStyle = 'hsl(' + h + ' 40% 42%)';
  g.font = 'bold 150px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(Array.from(base)[0] || '', 200, 158);
  return toBlobUrl(c.toDataURL('image/png'));
}
// 自分の写真を選んで確かめられるようにする。本番（index.html の shrinkImage）と同じ加工を通すので、
// 4:3の切り抜きも圧縮後の画質も実際のPOPと同じになる。選んだ写真は保存庫に残り、ブランドや向きを変えても使い回せる
function demoShrink(file) {
  return new Promise((ok, ng) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const sw = img.naturalWidth, sh = img.naturalHeight, r = 4 / 3;
      let cw = sw, ch = sw / r; if (ch > sh) { ch = sh; cw = sh * r; }
      const sx = (sw - cw) / 2, sy = (sh - ch) / 2;
      for (const w of [480, 400, 320]) {
        const c = document.createElement('canvas'); c.width = w; c.height = Math.round(w / r);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, sx, sy, cw, ch, 0, 0, c.width, c.height);
        for (const q of [0.8, 0.7, 0.6, 0.5]) { const d = c.toDataURL('image/jpeg', q); if (d.length < 48000) return ok(d); }
      }
      ng(new Error('小さくできない'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ng(new Error('読み込めない')); };
    img.src = url;
  });
}
// 写真の操作には通し番号を振る。加工や保存庫の読み出しを待つ間に次の操作が入ったら、古い結果は捨てる
async function demoPick(input) {
  const fs = Array.from(input.files || []); input.value = '';
  if (!fs.length) return;
  const seq = ++S.photoSeq;
  const out = [];
  for (const f of fs) { try { out.push(await demoShrink(f)); } catch (e) { /* 読めない写真は飛ばす */ } }
  if (seq !== S.photoSeq || !out.length) return;
  dbSet('state', 'demoImgs', out);
  demoApply(out);
}
function demoClear() { S.photoSeq++; dbSet('state', 'demoImgs', null); demoApply(null); }
function demoApply(list) { // list が無ければ見本の矩形に戻す。品目数より少なければ順に使い回す
  S.data.items.forEach((it, i) => {
    if (S.imgs[it.base]) URL.revokeObjectURL(S.imgs[it.base]);
    S.imgs[it.base] = list && list.length ? toBlobUrl(list[i % list.length]) : demoPhoto(it.base, i);
  });
  S.lastKey = null; // 写真が変わったので作り直す
  render();
}
async function demoStart() {
  const d = demoData(P.demo);
  d.items.forEach(it => { S.imgV[it.base] = 'demo'; });
  S.data = d; S.fetchedAt = Date.now(); // 時計は本番と同じ仕組みで進む
  demoApply(null);                      // まず見本の絵で出す（保存庫を待たせない）
  const seq = S.photoSeq;
  const saved = await dbGet('state', 'demoImgs');
  if (seq !== S.photoSeq) return;       // 待つ間に写真を選ばれた／消された
  if (Array.isArray(saved) && saved.length) demoApply(saved);
}

P.demo ? demoStart() : P.tid ? start() : pick();
</script>
