<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>軽食メニュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Montserrat:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--u:1vh;--w:1vw;--bg:#f7f7f5;--card:#fff;--text:#1f2329;--sub:#6b7280;--line:#e5e7eb;--accent:#1a73e8;--ok:#1e7d3a;--soon:#b06000}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#app{width:calc(var(--w)*100);height:calc(var(--u)*100);display:flex;flex-direction:column;position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#app.rot-r{transform:translateX(100vw) rotate(90deg)}
#app.rot-l{transform:translateY(100vh) rotate(-90deg)}
header{display:flex;align-items:baseline;justify-content:space-between;padding:calc(var(--u)*1.6) calc(var(--w)*2.4) calc(var(--u)*1.2);border-bottom:1px solid var(--line);background:#fff}
header h1{margin:0;font-size:calc(var(--u)*4.2);letter-spacing:.04em}
header h1 small{font-size:calc(var(--u)*2.2);color:var(--sub);font-weight:500;margin-left:calc(var(--w)*1.2);letter-spacing:0}
header .clock{font-size:calc(var(--u)*3);color:var(--sub);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;position:relative;padding:calc(var(--u)*1.6) calc(var(--w)*2);overflow:hidden}
.grid{display:grid;gap:var(--gap);height:100%;align-content:center;justify-content:center;grid-template-columns:repeat(var(--cols),var(--tw))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--tw)*.05);overflow:hidden;display:flex;flex-direction:column;height:var(--th);position:relative}
.ph{position:relative;flex:1;min-height:0;background:#eef0f2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{font-size:calc(var(--tw)*.22);font-weight:700;color:#c3c8cf}
.cap{padding:calc(var(--tw)*.035) calc(var(--tw)*.05) calc(var(--tw)*.04)}
.nm{font-weight:700;font-size:calc(var(--tw)*.085);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:calc(var(--tw)*.02);gap:6px}
.pr{font-size:calc(var(--tw)*.08);font-weight:700;font-variant-numeric:tabular-nums}
.st{font-size:calc(var(--tw)*.055);font-weight:700;border-radius:999px;padding:.15em .7em;white-space:nowrap}
.st.on{background:#e6f4ea;color:var(--ok)}
.st.soon{background:#fef3e2;color:var(--soon)}
.tile.sold .ph img,.tile.sold .ph .ini,.tile.sold .cap{filter:grayscale(1);opacity:.5}
.tile.sold .ph{background:#f1f1f1}
.band{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:rgba(32,33,36,.85);color:#fff;text-align:center;font-weight:800;letter-spacing:.12em;font-size:calc(var(--tw)*.12);padding:.18em 0;z-index:2}
.tile.soon .ph{opacity:.75}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*4);color:var(--sub);text-align:center;line-height:1.6}
.ctl{position:fixed;right:calc(var(--w)*1.2);bottom:calc(var(--u)*1.2);display:flex;gap:8px;opacity:0;transition:opacity .3s}
body:hover .ctl,.ctl:focus-within{opacity:1}
.ctl button,.ctl select{font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);cursor:pointer}
.offline{position:fixed;left:calc(var(--w)*1.2);bottom:calc(var(--u)*1.2);font-size:13px;color:#b3261e;background:#fdecea;border-radius:6px;padding:4px 10px;display:none}
.pick{max-width:560px;margin:calc(var(--u)*10) auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
.pick h2{margin:0 0 16px;font-size:22px}
.pick button{display:block;width:100%;text-align:left;font-size:18px;padding:14px 16px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.pick button:hover{border-color:var(--accent)}
header .logo{display:none}
/* ---- SPADIE（ロゴ画像と背景柄は assets/ の元画像の切り出し。加工しない） ---- */
body.b-spadie{background-color:#113465}
.b-spadie #app{--navy:#113465;--card:#0b2650;--yel:#f6c10a;--blu:#2d99d6;--pink:#e4007f;--text:#fff;--sub:#c9d6ea;--line:#2d99d6;
  background-color:#113465;background-repeat:repeat}
.b-spadie header{background:transparent;border-bottom:0;align-items:center;padding:calc(var(--u)*1.2) calc(var(--w)*2.4) .calc(var(--u)*4)}
.b-spadie header h1{display:flex;align-items:center;gap:calc(var(--w)*2);color:#fff}
.b-spadie header .logo{display:block;height:calc(var(--u)*19);width:auto}
.b-spadie header h1 .ttl{display:flex;flex-direction:column;gap:.calc(var(--u)*6)}
.b-spadie header h1 .t{font-family:"DotGothic16",sans-serif;font-weight:400;color:var(--yel);font-size:calc(var(--u)*6);letter-spacing:.08em;line-height:1.1}
.b-spadie header h1 small{color:#fff;margin:0;font-family:"DotGothic16",sans-serif;font-size:calc(var(--u)*2.6)}
.b-spadie header .clock{color:#fff;font-family:"DotGothic16",sans-serif;font-size:calc(var(--u)*5)}
.b-spadie main{padding-top:.calc(var(--u)*6)}
.b-spadie .tile{background:var(--card);border:.calc(var(--u)*3) solid var(--blu);border-radius:.calc(var(--u)*8)}
.b-spadie .ph{background:#1b3d70}
.b-spadie .ph .ini{color:#5f7fae;font-family:"DotGothic16",sans-serif}
.b-spadie .nm{color:#fff}
.b-spadie .pr{font-family:"DotGothic16",sans-serif;font-weight:400;color:var(--yel);font-size:calc(var(--tw)*.095)}
.b-spadie .st{font-family:"DotGothic16",sans-serif;font-weight:400;border-radius:.calc(var(--u)*4)}
.b-spadie .st.on{background:var(--yel);color:var(--navy)}
.b-spadie .st.soon{background:var(--blu);color:#fff}
.b-spadie .band{background:var(--navy);color:var(--yel);font-family:"DotGothic16",sans-serif;font-weight:400;letter-spacing:.16em;border-top:.calc(var(--u)*4) solid var(--pink);border-bottom:.calc(var(--u)*4) solid var(--pink)}
.b-spadie .tile.sold{border-color:#4a5f82}
.b-spadie .tile.sold .ph{background:#1b2c45}
.b-spadie .ctl button{color:#113465;border-color:#fff}
.b-spadie .empty{font-family:"DotGothic16",sans-serif;color:#fff}
/* ---- JOPT（白 / #c86b30）。ロゴは支給画像の切り出しのみ。フォントはすべて こぶりなゴシック Std（表示する端末にインストールされたものを使う。無い端末は Noto Sans JP） ---- */
@font-face{font-family:"JOPT Koburina";font-weight:300;src:local("KoburinaGoStd-W1"),local("Koburina Gothic Std W1"),local("こぶりなゴシック Std W1"),local("KoburinaGoStdN-W1"),local("Koburina Gothic StdN W1"),local("こぶりなゴシック StdN W1")}
@font-face{font-family:"JOPT Koburina";font-weight:400;src:local("KoburinaGoStd-W3"),local("Koburina Gothic Std W3"),local("こぶりなゴシック Std W3"),local("KoburinaGoStdN-W3"),local("Koburina Gothic StdN W3"),local("こぶりなゴシック StdN W3")}
@font-face{font-family:"JOPT Koburina";font-weight:600;src:local("KoburinaGoStd-W6"),local("Koburina Gothic Std W6"),local("こぶりなゴシック Std W6"),local("KoburinaGoStdN-W6"),local("Koburina Gothic StdN W6"),local("こぶりなゴシック StdN W6")}
@font-face{font-family:"JOPT Koburina";font-weight:700;src:local("KoburinaGoStd-W6"),local("Koburina Gothic Std W6"),local("こぶりなゴシック Std W6"),local("KoburinaGoStdN-W6"),local("Koburina Gothic StdN W6"),local("こぶりなゴシック StdN W6")}
@font-face{font-family:"JOPT Koburina";font-weight:900;src:local("KoburinaGoStd-W9"),local("Koburina Gothic Std W9"),local("こぶりなゴシック Std W9"),local("KoburinaGoStdN-W9"),local("Koburina Gothic StdN W9"),local("こぶりなゴシック StdN W9")}
.b-jopt #app{--acc:#c86b30;--text:#2b2b2b;--sub:#7a7a7a;--line:#ece4dc;font-family:"JOPT Koburina","Noto Sans JP",-apple-system,sans-serif;background:#fff}
.b-jopt header{background:transparent;border-bottom:1px solid var(--line);align-items:center;padding:calc(var(--u)*1.6) calc(var(--w)*3) calc(var(--u)*1.4)}
.b-jopt header h1{display:flex;align-items:center;gap:calc(var(--w)*2.2)}
.b-jopt header .logo{display:block;height:calc(var(--u)*15);width:auto}
.b-jopt header h1 .ttl{display:flex;flex-direction:column;gap:calc(var(--u)*.9)}
.b-jopt header h1 .t{font-weight:400;letter-spacing:.32em;font-size:calc(var(--u)*4.4);color:var(--text);line-height:1.1}
.b-jopt header h1 small{margin:0;font-weight:600;letter-spacing:.2em;font-size:calc(var(--u)*1.8);color:var(--acc)}
.b-jopt header .clock{font-weight:400;letter-spacing:.06em;font-size:calc(var(--u)*4);color:var(--text)}
.b-jopt main{padding:calc(var(--u)*2.4) calc(var(--w)*3)}
.b-jopt .tile{background:#fff;border:1px solid var(--line);border-radius:calc(var(--u)*.5);box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.4) rgba(90,45,15,.08)}
.b-jopt .ph{background:#f6f1ec}
.b-jopt .ph .ini{color:#e3cdbd;font-weight:300}
.b-jopt .nm{font-weight:400;color:var(--text);letter-spacing:.04em}
.b-jopt .pr{font-weight:600;color:var(--acc);letter-spacing:.04em}
.b-jopt .st{font-weight:600;border-radius:2px;letter-spacing:.12em}
.b-jopt .st.on{background:var(--acc);color:#fff}
.b-jopt .st.soon{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.b-jopt .band{background:rgba(255,255,255,.92);color:var(--acc);font-weight:600;letter-spacing:.32em;font-size:calc(var(--tw)*.1);border-top:1px solid var(--acc);border-bottom:1px solid var(--acc)}
.b-jopt .tile.sold .ph img{opacity:.45}
.b-jopt .empty{color:var(--sub);letter-spacing:.12em}
.b-jopt-o #app{background:#c86b30;--line:rgba(255,255,255,.4)}
.b-jopt-o header{background:#fff;border-bottom:0;box-shadow:0 calc(var(--u)*.2) calc(var(--u)*1.2) rgba(60,25,5,.15)}
.b-jopt-o .tile{border:0;box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.6) rgba(60,25,5,.18)}
.b-jopt-o .empty{color:#fff}
.o-v.b-jopt header .logo{height:calc(var(--u)*9)}
.o-v.b-jopt header h1 .t{font-size:calc(var(--u)*3)}
.o-v.b-jopt header h1 small{font-size:calc(var(--u)*1.4)}
.o-v.b-jopt header .clock{font-size:calc(var(--u)*2.8)}
/* ---- 縦置き ---- */
.o-v header{flex-wrap:nowrap;gap:calc(var(--w)*2)}
.o-v header h1{min-width:0}
.o-v.b-spadie header .logo{height:calc(var(--u)*10)}
.o-v.b-spadie header h1 .t{font-size:calc(var(--u)*3.3)}
.o-v.b-spadie header h1 small{font-size:calc(var(--u)*1.8)}
.o-v.b-spadie header .clock{font-size:calc(var(--u)*3.4)}
.o-v header h1{font-size:calc(var(--u)*3.4)}
.o-v header h1 small{font-size:calc(var(--u)*1.7)}
.o-v header .clock{font-size:calc(var(--u)*2.4)}
.o-v .empty{font-size:calc(var(--u)*3)}
</style>
</head>
<body>
<div id="app"></div>
<div class="offline" id="off">通信できません（前回の表示のまま）</div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzCLMde4qTOdRf06XvaUvqnHq3iKx6n3T_NXuQj_73kWVgeTVVCr8uoy8agzA7cvcSlNw/exec';
const POLL = 30000;
const q = new URLSearchParams(location.search);
const P = { tid: q.get('t') || '', mode: q.get('mode') === 'all' ? 'all' : 'now', date: q.get('date') || '', brand: (q.get('brand') || '').toLowerCase(), orient: ['v', 'v2'].includes(q.get('orient')) ? q.get('orient') : 'h' };
// ブランド別デザイン：URLの brand（jopt / spadie）を優先し、なければ大会名に SPADIE を含むかで決める
// SPADIE：assets/LINE_ALBUM_SPADIE ロゴ_260908_2.png（支給されたロゴ画像そのもの）から、表示時にロゴ部分と背景柄の1区画を切り出して使う。画像は加工しない
const JOPT_LOGO = { src: 'assets/' + encodeURIComponent('JOPTロゴ-02.png'), crop: { x: 187, y: 187, w: 687, h: 893 } }; // JOPTロゴ（支給画像）。加工せず切り出すだけ
const BRAND = {
  spadie: { src: 'assets/' + encodeURIComponent('LINE_ALBUM_SPADIE ロゴ_260908_2.png'), crop: { x: 40, y: 285, w: 1120, h: 620 }, tile: { x: 0, y: 0, w: 546, h: 274 } },
  'jopt-w': Object.assign({ cls: 'b-jopt' }, JOPT_LOGO), // JOPT：白背景
  'jopt-o': Object.assign({ cls: 'b-jopt' }, JOPT_LOGO), // JOPT：#c86b30 背景
};
function cut(img, r) { const c = document.createElement('canvas'); c.width = r.w; c.height = r.h; c.getContext('2d').drawImage(img, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h); return c.toDataURL('image/png'); }
function prepBrand(B) {
  if (!B.src || B.ready || B.loading) return;
  B.loading = true;
  const img = new Image();
  img.onload = () => { B.logo = cut(img, B.crop); if (B.tile) B.bg = cut(img, B.tile); B.ready = true; if (S.data) render(); };
  img.onerror = () => { B.loading = false; };
  img.src = B.src;
}
// ブランド：URLの brand（std / spadie / jopt-w / jopt-o）を優先。なければ大会名で判定（SPADIE → spadie、JOPT かつ Osaka → jopt-w、その他 → 標準）
function brandOf(name) {
  if (BRAND[P.brand] || P.brand === 'std') return P.brand;
  if (/spadie/i.test(name || '')) return 'spadie';
  if (/jopt/i.test(name || '') && /osaka/i.test(name || '')) return 'jopt-w';
  return 'std';
}
const S = { data: null, imgs: {}, imgV: {}, tick: null };
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function call(fn, ...args) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'エラー');
  return j.result;
}
function setParam() {
  const u = new URL(location.href);
  u.searchParams.set('t', P.tid); u.searchParams.set('mode', P.mode);
  if (P.orient === 'h') u.searchParams.delete('orient'); else u.searchParams.set('orient', P.orient);
  history.replaceState(null, '', u);
}

/* --- 大会の選択（URLに t がないとき） --- */
async function pick() {
  app.innerHTML = '<div class="empty">読み込み中…</div>';
  try {
    const r = await call('getPopState', '');
    app.innerHTML = `<div class="pick"><h2>表示する大会を選んでください</h2>${r.tournaments.length ? r.tournaments.map(t => `<button onclick="choose('${esc(t.id)}')">${esc(t.name)}</button>`).join('') : '<div>表示中の大会がありません。</div>'}</div>`;
  } catch (e) { app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function choose(id) { P.tid = id; setParam(); start(); }

/* --- 表示 --- */
function addDay(d, n) { const x = new Date(d + 'T00:00:00+09:00'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function recvAt(date, hm) { if (!hm) return ''; const [h] = hm.split(':').map(Number); return (h < 5 ? addDay(date, 1) : date) + ' ' + hm.padStart(5, '0'); }
function nowStr() {
  // サーバー時刻を基準に、取得からの経過分を足す（端末の時計がずれていても表示がずれないように）
  const base = new Date(S.data.now.replace(' ', 'T') + ':00+09:00').getTime() + (Date.now() - S.fetchedAt);
  const d = new Date(base + 9 * 3600000).toISOString();
  return d.slice(0, 10) + ' ' + d.slice(11, 16);
}
function tiles() {
  const d = S.data, now = nowStr(), map = new Map();
  d.items.forEach(it => { if (!map.has(it.base)) map.set(it.base, []); map.get(it.base).push(it); });
  const out = [];
  map.forEach((rs, base) => {
    const cur = rs.filter(r => (!r.recv || recvAt(d.date, r.recv) <= now) && (!r.exp || now < r.exp));
    const fut = rs.filter(r => r.recv && recvAt(d.date, r.recv) > now).map(r => r.recv).sort();
    let st;
    if (cur.some(r => !r.sold)) st = 'on';
    else if (cur.length) st = 'sold';
    else if (fut.length) st = 'soon';
    else st = 'ended';
    if (P.mode === 'now' && (st === 'soon' || st === 'ended')) return;
    out.push({ base, st, from: fut[0] || '', info: d.info[base] || {} });
  });
  return out;
}
function layout(n) {
  const m = document.querySelector('main'); if (!m || !n) return;
  const cs = getComputedStyle(m);
  const W = m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
  const H = m.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2, ratio = 1.05; // 高さ = 幅 × ratio
  let best = { tw: 0 };
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), gap = Math.max(8, Math.min(W, H) * 0.018);
    const tw = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r / ratio);
    if (tw > best.tw) best = { tw, c, gap };
  }
  const g = document.querySelector('.grid');
  g.style.setProperty('--cols', best.c); g.style.setProperty('--tw', best.tw + 'px');
  g.style.setProperty('--th', best.tw * ratio + 'px'); g.style.setProperty('--gap', best.gap + 'px');
}
// 向き：h＝横、v＝縦、v2＝縦（上下逆）。縦で画面が横長のとき（縦置きのテレビが回転表示できない場合）は90°回転して表示する
function orient() {
  const a = app.style, W = innerWidth, H = innerHeight, rot = P.orient !== 'h' && W > H;
  app.className = rot ? (P.orient === 'v' ? 'rot-r' : 'rot-l') : (P.orient === 'v2' ? 'rot-f' : '');
  const w = rot ? H : W, h = rot ? W : H;
  a.setProperty('--u', h / 100 + 'px'); a.setProperty('--w', w / 100 + 'px');
  a.transform = !rot && P.orient === 'v2' ? 'rotate(180deg)' : ''; a.transformOrigin = !rot && P.orient === 'v2' ? '50% 50%' : '';
  document.body.classList.toggle('o-v', P.orient !== 'h');
}
function render() {
  const d = S.data;
  const list = tiles();
  const hm = nowStr().slice(11);
  const b = brandOf(d.name), B = BRAND[b] || {};
  document.body.className = 'b-' + b + (B.cls ? ' ' + B.cls : '');
  orient();
  prepBrand(B);
  app.style.backgroundImage = B.bg ? `url(${B.bg})` : '';
  app.innerHTML = `<header><h1>${B.logo ? `<img class="logo" src="${B.logo}" alt="">` : ''}<span class="ttl"><span class="t">軽食メニュー</span><small>${esc(d.name)}</small></span></h1><div class="clock">${hm}</div></header>
    <main>${list.length ? `<div class="grid">${list.map(t => {
      const img = S.imgs[t.base];
      const price = t.info.price !== '' && t.info.price != null ? '¥' + Number(t.info.price).toLocaleString('ja-JP') : '';
      const badge = t.st === 'on' ? '<span class="st on">販売中</span>' : t.st === 'soon' ? `<span class="st soon">${esc(t.from)}から販売</span>` : '';
      return `<div class="tile ${t.st === 'sold' || t.st === 'ended' ? 'sold' : t.st}">
        <div class="ph">${img ? `<img src="${img}" alt="">` : `<span class="ini">${esc(Array.from(t.base)[0] || '')}</span>`}${t.st === 'sold' || t.st === 'ended' ? '<div class="band">SOLD OUT</div>' : ''}</div>
        <div class="cap"><div class="nm">${esc(t.base)}</div><div class="row"><span class="pr">${price}</span>${badge}</div></div></div>`;
    }).join('')}</div>` : `<div class="empty">${P.mode === 'now' ? '現在販売中の軽食はありません' : '本日の軽食はありません'}</div>`}</main>
    <div class="ctl"><button onclick="toggleMode()">${P.mode === 'now' ? '表示：販売中のみ → 全品目に切替' : '表示：全品目 → 販売中のみに切替'}</button><button onclick="toggleOrient()">向き：${({ h: '横', v: '縦', v2: '縦（上下逆）' })[P.orient]} → 切替</button><button onclick="fs()">全画面</button><button onclick="P.tid='';pick()">大会を変更</button></div>`;
  layout(list.length);
  alignBg(B);
}
// 背景柄をロゴ画像内の柄と継ぎ目なくつなげる（ロゴは元画像の (crop.x, crop.y) から切り出しているため、その位置に柄の原点を合わせる）
function alignBg(B) {
  const st = app.style;
  const img = document.querySelector('header .logo');
  if (!B.tile || !img) { st.backgroundSize = st.backgroundPosition = ''; return; }
  const set = () => {
    let x = 0, y = 0, e = img; // #app 内での位置（回転の影響を受けないレイアウト上の座標）
    while (e && e !== app) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
    const k = img.offsetHeight / B.crop.h; if (!k) return;
    st.backgroundSize = (B.tile.w * k) + 'px ' + (B.tile.h * k) + 'px';
    st.backgroundPosition = (x - B.crop.x * k) + 'px ' + (y - B.crop.y * k) + 'px';
  };
  img.complete ? set() : img.addEventListener('load', set, { once: true });
}
function toggleOrient() { P.orient = ({ h: 'v', v: 'v2', v2: 'h' })[P.orient]; setParam(); render(); }
function toggleMode() { P.mode = P.mode === 'now' ? 'all' : 'now'; setParam(); render(); }
function fs() { const e = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : e.requestFullscreen && e.requestFullscreen()); }

async function load() {
  try {
    const d = await call('getPopState', P.tid, P.date);
    S.data = d; S.fetchedAt = Date.now();
    document.getElementById('off').style.display = 'none';
    // 写真は更新日時が変わったものだけ取り直す
    const need = Object.keys(d.info).filter(n => d.info[n].img && S.imgV[n] !== d.info[n].v);
    Object.keys(S.imgs).forEach(n => { if (!d.info[n] || !d.info[n].img) { delete S.imgs[n]; delete S.imgV[n]; } });
    if (need.length) {
      const im = await call('getPopImages', need);
      need.forEach(n => { if (im[n]) { S.imgs[n] = im[n]; S.imgV[n] = d.info[n].v; } });
    }
    render();
  } catch (e) {
    if (!S.data) app.innerHTML = `<div class="empty">${esc(e.message)}<br><small>しばらくすると自動で再読み込みします</small></div>`;
    else document.getElementById('off').style.display = 'block';
  }
}
function start() {
  clearInterval(S.tick);
  app.innerHTML = '<div class="empty">読み込み中…</div>';
  load();
  S.tick = setInterval(() => { load(); }, POLL);
}
setInterval(() => { if (S.data) render(); }, 60000); // 受取時刻・賞味期限の到来を反映
window.addEventListener('resize', () => { if (S.data) render(); });
P.tid ? start() : pick();
</script>
</body>
