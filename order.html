<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>軽食の注文</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--text:#1f2329;--sub:#6b7280;--accent:#1a73e8;--accent-weak:#e8f0fe;--danger:#d93025;--danger-weak:#fce8e6;--ok:#1e7d3a;--ok-weak:#e6f4ea;--warn-weak:#fef7e0;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo","BIZ UDPGothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:20px;margin:0 0 2px}
.small{font-size:13px;color:var(--sub);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.seat{font-weight:700;font-size:17px}
.link{background:none;border:0;color:var(--accent);font-size:14px;padding:0;cursor:pointer;text-decoration:underline}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;line-height:1.5}
.notice.info{background:var(--accent-weak)}
.notice.warn{background:var(--warn-weak)}
.notice.bad{background:var(--danger-weak)}
.notice.ok{background:var(--ok-weak)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin-top:12px}
.seats button{padding:16px 0;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);cursor:pointer}
.seats button:active{background:var(--accent-weak)}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.ph{width:68px;height:51px;border-radius:8px;background:#eef0f2;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#c3c8cf;font-weight:700}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.nm{flex:1;min-width:0;font-weight:700;line-height:1.35}
.tk{font-size:13px;color:var(--accent);font-weight:600;margin-top:2px}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px;line-height:1;cursor:pointer;color:var(--text)}
.qty button:disabled{opacity:.35;cursor:default}
.qty span{min-width:22px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-size:14px;line-height:1.4}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{background:#c3c8cf;cursor:default}
.btn.sub{background:#fff;color:var(--text);border:1px solid var(--line);font-weight:500;padding:10px 14px;font-size:14px}
.empty{color:var(--sub);text-align:center;padding:24px 0}
.st{display:flex;gap:10px;align-items:baseline;padding:6px 0}
.st b{font-weight:700}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge.recv{background:var(--accent-weak);color:var(--accent)}
.badge.go{background:var(--warn-weak);color:#8a6100}
.badge.done{background:var(--ok-weak);color:var(--ok)}
.badge.cancel{background:var(--danger-weak);color:var(--danger)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#1f2329;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="bar"></div>
<div id="toast"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzCLMde4qTOdRf06XvaUvqnHq3iKx6n3T_NXuQj_73kWVgeTVVCr8uoy8agzA7cvcSlNw/exec';
const TIMEOUT = 25000;   // 1回の通信をあきらめるまで。会場の回線が遅いため長めに取る
const QUEUE_MS = 300000; // 送信待ちの有効期限（5分）。これを過ぎた注文は送らない。席を立っている・期限切れの恐れがあるため

const q = new URLSearchParams(location.search);
const P = { tid: q.get('t') || '', table: q.get('tb') || '', token: q.get('k') || '' };
const S = { view: 'load', err: '', data: null, imgs: {}, seat: '', qty: {}, busy: false, order: null, tick: null, poll: null, menu: [], gen: 0 };

const app = document.getElementById('app');
const bar = document.getElementById('bar');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

async function call(fn, ...args) {
  const ac = new AbortController();
  const to = setTimeout(() => ac.abort(), TIMEOUT);
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), signal: ac.signal });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j.result;
  } finally { clearTimeout(to); }
}
function netMsg(e) { return e && e.name === 'AbortError' ? '通信がとても遅いため中断しました' : (e && e.message) || '通信できませんでした'; }

/* --- 席番号は「大会×卓」ごとに覚える。別の卓のQRを開いたら選び直しになる（誤配達を防ぐ） --- */
const seatKey = () => 'kSeat:' + P.tid + ':' + P.table;
function savedSeat() { return String(LS.get(seatKey(), '') || ''); }
function pickSeat(n) { S.seat = String(n); LS.set(seatKey(), S.seat); render(); }

/* --- 販売中の品目（POPと同じ判定を画面側でもやる。最終判断はサーバー） --- */
function addDay(d, n) { const x = new Date(d + 'T00:00:00+09:00'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function recvAt(date, hm) { if (!hm) return ''; const h = +hm.slice(0, 2); return (h < 5 ? addDay(date, 1) : date) + ' ' + hm; }
function onSale() {
  const d = S.data, now = d.now, map = new Map();
  d.items.forEach(it => { if (!map.has(it.base)) map.set(it.base, []); map.get(it.base).push(it); });
  const out = [];
  map.forEach((rs, base) => {
    const live = rs.filter(r => (!r.recv || recvAt(d.date, r.recv) <= now) && (!r.exp || now < r.exp));
    if (!live.length || !live.some(r => !r.sold)) return;
    out.push({ base, info: d.info[base] || {} });
  });
  return out;
}
const ticketOf = info => (info.price !== '' && info.price != null ? Number(info.price) : 0);
function totals() {
  let n = 0, tk = 0;
  onSale().forEach(x => { const c = S.qty[x.base] || 0; n += c; tk += c * ticketOf(x.info); });
  return { n, tk };
}

/* --- 読み込み --- */
async function load() {
  try {
    const d = await call('getOrderMenu', P.tid, P.table, P.token); // QRの正しさ・席数・受付状況もここで分かる
    S.data = d; S.err = '';
    // 席数が変わった／保存値が壊れているときは選び直させる（存在しない席に注文して断られ続けるのを防ぐ）
    const sn = Number(S.seat);
    if (S.seat && !(sn >= 1 && sn <= d.seats && sn === Math.floor(sn))) S.seat = '';
    const need = Object.keys(d.info).filter(n => d.info[n].img && !S.imgs[n]);
    if (need.length) {
      const im = await call('getPopImages', need.slice(0, 30));
      Object.keys(im).forEach(n => { S.imgs[n] = im[n]; });
    }
    // 注文結果や送信待ちの表示を、定期取得で閉じてしまわない
    if (S.view === 'load' || S.view === 'error' || S.view === 'menu') S.view = 'menu';
  } catch (e) {
    S.err = netMsg(e);
    if (!S.data) S.view = 'error';
  }
  render();
}

/* --- 注文の送信。送れなければ端末に置いて再送する（5分で失効） --- */
// 壊れた保存値でも落ちないように、必ず配列にそろえる
function queue() { const v = LS.get('kOrderQ', []); return Array.isArray(v) ? v.filter(j => j && j.reqId) : []; }
function setQueue(v) { LS.set('kOrderQ', v); }
function canStore() { try { localStorage.setItem('kTest', '1'); localStorage.removeItem('kTest'); return true; } catch (e) { return false; } }
async function submit() {
  const { n, tk } = totals();
  if (!n) return;
  if (!S.seat) return toast('席番号を選んでください');
  const items = Object.keys(S.qty).filter(k => S.qty[k] > 0).map(k => ({ name: k, qty: S.qty[k] }));
  const job = { tid: P.tid, table: P.table, token: P.token, seat: S.seat, items, reqId: uid(), at: Date.now(), tk };
  S.busy = true; render();
  try {
    const r = await call('placeOrder', job.tid, job.table, job.token, job.seat, job.items, job.reqId);
    S.qty = {}; S.order = { id: r.id, key: r.key, lines: r.lines };
    LS.set('kLastOrder', { id: r.id, key: r.key, at: Date.now() });
    S.view = 'done'; startPoll();
  } catch (e) {
    if (e && (e.name === 'AbortError' || /Failed to fetch|NetworkError|Load failed/i.test(e.message || ''))) {
      if (!canStore()) { toast('電波が届きません。もう一度お試しください'); return; }   // 保存できないのに「送信待ち」と言わない
      setQueue(queue().concat([job]));           // つながらなかっただけ。あとで送る
      S.qty = {}; S.view = 'queued';
      toast('送信待ちにしました');
    } else { toast(e.message || 'エラー'); }
  } finally { S.busy = false; render(); }
}
async function flush() {
  if (flush.busy) return;                       // 15秒ごとの再送と、再表示時の再送が重ならないように
  let qs = queue();
  if (!qs.length) return;
  const live = qs.filter(j => Date.now() - j.at < QUEUE_MS);
  if (live.length !== qs.length) { setQueue(live); toast('時間が経ったため、送れなかった注文を取り消しました'); render(); }
  if (!live.length) return;
  const j = live[0];
  flush.busy = true;
  const gen = S.gen;                            // 送っている間に取り消されたら、結果を使わない
  try {
    const r = await call('placeOrder', j.tid, j.table, j.token, j.seat, j.items, j.reqId);
    setQueue(queue().filter(x => x.reqId !== j.reqId));
    // いま開いている卓・大会の注文でなければ画面には出さない（卓を移ったあとに前の卓の再送が通った場合）
    if (gen === S.gen && j.tid === P.tid && j.table === P.table) {
      S.order = { id: r.id, key: r.key, lines: r.lines };
      LS.set('kLastOrder', { id: r.id, key: r.key, tid: j.tid, table: j.table, at: Date.now() });
      S.view = 'done'; startPoll();
    }
    render();
  } catch (e) {
    if (!(e && (e.name === 'AbortError' || /Failed to fetch|NetworkError|Load failed/i.test(e.message || '')))) {
      setQueue(queue().filter(x => x.reqId !== j.reqId));   // サーバーに断られた。残しても通らない
      toast(e.message || 'エラー'); render();
    }
  } finally { flush.busy = false; }
}
// 取り消したあとに再送の応答が返ってきても「注文できました」にしない
function cancelQueued() { S.gen++; setQueue([]); S.view = 'menu'; render(); toast('取り消しました。送信中だった場合は届いていることがあります'); }

/* --- 注文したあとの状態表示 --- */
function startPoll() {
  clearInterval(S.poll);
  S.poll = setInterval(async () => {
    if (!S.order || document.hidden) return;
    const id = S.order.id;
    try {
      const r = await call('getOrder', id, S.order.key);
      if (S.order && S.order.id === id && r.id === id) { S.order.lines = r.lines; render(); }  // 遅れて返った前の注文の結果を入れない
    } catch (e) {}
  }, 10000);
}
const stateBadge = s => s === '受付' ? '<span class="badge recv">受付ました</span>'
  : s === '配達中' ? '<span class="badge go">お届け中</span>'
  : s === '完了' ? '<span class="badge done">お届け済み</span>'
  : '<span class="badge cancel">取消</span>';

/* --- 描画 --- */
function render() {
  if (S.view === 'load') { app.innerHTML = '<div class="empty">読み込み中…</div>'; bar.innerHTML = ''; return; }
  if (S.view === 'error') {
    app.innerHTML = `<div class="card"><div class="notice bad">${esc(S.err)}</div><button class="btn" onclick="load()">もう一度</button></div>`;
    bar.innerHTML = ''; return;
  }
  if (!P.tid || !P.table || !P.token) {
    app.innerHTML = '<div class="card"><div class="notice bad">このQRからは注文できません。卓のQRコードを読み取ってください。</div></div>';
    bar.innerHTML = ''; return;
  }
  const head = `<div class="head"><div><h1>${esc(S.data ? S.data.name : '')}</h1>
    <div class="seat">${esc(P.table)}番テーブル${S.seat ? ' ' + esc(S.seat) + '番シート' : ''}</div></div>
    ${S.seat ? '<button class="link" onclick="S.seat=\'\';render()">席を変える</button>' : ''}</div>`;

  if (S.view === 'queued') {
    const n = queue().length;
    app.innerHTML = head + `<div class="card"><div class="notice warn">電波が届かないため、注文を送信待ちにしました。つながり次第おくります。${n ? '' : ''}</div>
      <div class="small">5分経っても送れない場合は取り消します。お急ぎの場合はスタッフにお声がけください。</div>
      <button class="btn sub" style="margin-top:12px" onclick="cancelQueued()">送信待ちを取り消す</button></div>`;
    bar.innerHTML = ''; return;
  }
  if (S.view === 'done' && S.order) {
    const ls = S.order.lines || [];
    const taken = ls.filter(l => l.by)[0];
    app.innerHTML = head + `<div class="card">
      <div class="notice ok">ご注文を受け付けました。スタッフがお席までお届けします。</div>
      ${ls.map(l => `<div class="st"><b style="flex:1">${esc(l.name)}${l.qty > 1 ? ' ×' + l.qty : ''}</b>${stateBadge(l.state)}</div>
        ${l.state === '取消' && l.reason ? `<div class="small" style="margin:-4px 0 8px">${esc(l.reason)}</div>` : ''}`).join('')}
      ${taken && taken.by ? `<div class="notice info" style="margin-top:10px">${esc(taken.by)}が届けに行きます。</div>` : ''}
      <div class="small" style="margin-top:10px">ドリチケはお渡しのときにお預かりします。</div>
      <button class="btn sub" style="margin-top:12px" onclick="S.view='menu';render()">続けて注文する</button></div>`;
    bar.innerHTML = ''; return;
  }
  if (S.data && S.data.open === false) {
    app.innerHTML = head + `<div class="card"><div class="notice warn">ただいま注文を受け付けていません。${S.data.hours ? '受付時間：' + esc(S.data.hours) : ''}</div>
      <div class="small">スタッフにお声がけください。</div>
      <button class="btn sub" style="margin-top:12px" onclick="load()">更新</button></div>`;
    bar.innerHTML = ''; return;
  }
  if (!S.seat) {
    const seats = (S.data && S.data.seats) || 10;
    app.innerHTML = head + `<div class="card"><div style="font-weight:700">何番シートですか？</div>
      <div class="small">お届け先の確認に使います。</div>
      <div class="seats">${Array.from({ length: seats }, (_, i) => `<button onclick="pickSeat(${i + 1})">${i + 1}</button>`).join('')}</div></div>`;
    bar.innerHTML = ''; return;
  }
  const list = S.menu = onSale();   // ボタンからは品目名ではなく番号で指す（品目名を onclick に埋めると、名前に ' が入ったとき壊れる・実行される）
  const stale = S.err ? `<div class="notice warn">${esc(S.err)}　最新の在庫を確認できていません。注文する前に「更新」を押してください。</div>` : '';
  app.innerHTML = head + stale + (queue().length ? '<div class="notice warn">送信待ちの注文があります。</div>' : '') +
    (list.length ? `<div class="card">${list.map((x, i) => {
      const c = S.qty[x.base] || 0, tk = ticketOf(x.info), img = S.imgs[x.base];
      return `<div class="it">
        <div class="ph">${img ? `<img src="${esc(img)}" alt="">` : esc(Array.from(x.base)[0] || '')}</div>
        <div class="nm">${esc(x.base)}${tk ? `<div class="tk">ドリチケ${tk}枚</div>` : ''}</div>
        <div class="qty"><button onclick="bump(${i},-1)" ${c ? '' : 'disabled'}>−</button><span>${c}</span><button onclick="bump(${i},1)">＋</button></div>
      </div>`;
    }).join('')}</div>` : '<div class="card empty">ただいま注文できる軽食がありません</div>') +
    `<button class="btn sub" onclick="load()">更新</button>`;

  const { n, tk } = totals();
  bar.innerHTML = `<div class="bar"><div class="in"><div class="sum">${n ? `${n}点　<b>ドリチケ${tk}枚</b>` : '品目を選んでください'}</div>
    <button class="btn" ${n && !S.busy && !S.err ? '' : 'disabled'} onclick="confirmSubmit()">注文する</button></div></div>`;
}
function bump(i, d) {
  const x = (S.menu || [])[i]; if (!x) return;
  const name = x.base;
  const cur = S.qty[name] || 0;
  const next = Math.max(0, cur + d);
  const other = Object.keys(S.qty).reduce((a, k) => a + (k === name ? 0 : S.qty[k]), 0);
  if (next + other > 5) return toast('一度に注文できるのは合計5個までです');
  S.qty[name] = next;
  if (!next) delete S.qty[name];
  render();
}
function confirmSubmit() {
  const { n, tk } = totals();
  const lines = Object.keys(S.qty).filter(k => S.qty[k] > 0).map(k => '・' + k + ' ' + S.qty[k] + '個').join('\n');
  if (!confirm(P.table + '番テーブル ' + S.seat + '番シート に、この内容でお届けします。\n\n' + lines + '\n\nドリチケ' + tk + '枚（お渡しのときにお預かりします）')) return;
  submit();
}

/* --- 起動 --- */
S.seat = savedSeat();
load();
setInterval(() => { if (!document.hidden) load(); }, 60000);  // 在庫の変化を拾う
setInterval(flush, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); flush(); } });
</script>
</body>
</html>
